<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Summa keeps a small business's invoices, receivables and books." />
<title>Summa</title>
<!-- An empty icon: without it Chromium requests /favicon.ico and logs a 404. -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./summa-app.css" />
</head>
<body>
<!-- Structure and presentation only. Every value below is projected by the F#
     engine (src/Summa.Web.Engine/Accounting.fs) through Limen's data-*
     bindings, and every control sends a named event back to it. Forma owns
     presentation, Folio the printed invoice. Nothing here decides anything:
     readiness, issue, payments and totals are Summa's domain commands. -->
<a class="ef-skip-link" href="#main">Skip to content</a>

<template data-if="hasBanner">
  <p class="summa-banner" role="note" data-pages-banner data-text="environmentBanner"></p>
</template>

<template data-if="isConfiguring">
  <main class="summa-gate" id="main" aria-busy="true"><p>Opening Summa…</p></main>
</template>

<template data-if="isMisconfigured">
  <main class="summa-gate ef-stack" id="main">
    <h1>This deployment is not set up correctly.</h1>
    <p role="alert" id="misconfiguration" data-text="misconfiguration"></p>
  </main>
</template>

<template data-if="hasOperationalFault">
  <div class="ef-fault ef-fault--inline operational-fault" id="operational-fault" data-ef-intent="inline" data-ef-severity="error" role="alert" aria-labelledby="operational-fault-title">
    <div class="ef-fault__marker" aria-hidden="true">!</div>
    <div class="ef-fault__body">
      <p class="ef-fault__severity">Operational error</p>
      <p class="ef-fault__title" id="operational-fault-title"><strong data-text="operationalFaultTitle"></strong></p>
      <p class="ef-fault__message" data-text="operationalFaultMessage"></p>
      <p class="ef-fault-reference">Reference <code data-text="operationalFaultReference"></code></p>
    </div>
  </div>
</template>

<!-- Sign-in (WI-0035): Fides' client signs the person in with GitHub. Summa
     never sees a password or a token; the actor is GitHub's numeric id. -->
<template data-if="isRestoringSession">
  <main class="summa-gate" id="main" aria-busy="true"><p>Checking who is signed in…</p></main>
</template>

<template data-if="needsSignIn">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">Sign in to Summa</h1>
    <p>These books are kept on GitHub. Sign in with your GitHub account to open them.</p>
    <div role="status" aria-live="polite">
      <template data-if="hasSignInNotice"><p class="summa-notice" id="sign-in-notice" data-text="signInNotice"></p></template>
    </div>
    <label class="summa-check"><input type="checkbox" id="keep-sign-in" data-event="keepSignInToggled" data-on="change" data-bind-checked="keepInTab" /> Keep me signed in while this tab is open</label>
    <button type="button" class="ef-button" id="sign-in" data-event="signInRequested" data-bind-disabled="isLeavingForProvider">Sign in with GitHub</button>
  </main>
</template>

<!-- Books on GitHub (WI-0037): what the store found for the signed-in person. -->
<template data-if="awaitsGitHubStore">
  <main class="summa-gate ef-stack" id="main" aria-busy="true" aria-labelledby="signed-in-title">
    <h1 id="signed-in-title">Signed in as <span id="signed-in-login" data-text="signedInLogin"></span></h1>
    <p>Opening the books on GitHub…</p>
  </main>
</template>

<template data-if="booksNotSetUp">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="not-set-up-title">
    <h1 id="not-set-up-title">These books are not set up yet</h1>
    <template data-if="mayFound">
      <div class="ef-stack">
        <p>You are one of this organization's listed administrators. Setting it up creates its folder in the data repository, with you as its first administrator.</p>
        <button type="button" class="ef-button" id="found-books" data-event="foundRequested">Set up the books</button>
      </div>
    </template>
    <p id="not-set-up-reason" data-text="notSetUpReason"></p>
    <button type="button" class="ef-button" data-variant="secondary" id="sign-out" data-event="signOutRequested">Sign out <span data-text="signedInLogin"></span></button>
  </main>
</template>

<template data-if="awaitingAdministrator">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="awaiting-title">
    <h1 id="awaiting-title">These books have no listed administrator</h1>
    <p>Nothing is granted until one of the administrators this deployment lists confirms themself.</p>
    <template data-if="canConfirm">
      <button type="button" class="ef-button" id="confirm-administrator" data-event="confirmRequested">Confirm me as administrator</button>
    </template>
    <button type="button" class="ef-button" data-variant="secondary" id="sign-out" data-event="signOutRequested">Sign out <span data-text="signedInLogin"></span></button>
  </main>
</template>

<template data-if="booksOutdated">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="outdated-title">
    <h1 id="outdated-title">These books need updating before anyone works in them</h1>
    <p>They were written by an earlier version of Summa. Updating names the credit, deposit and bad-debt accounts from the books' own chart, in one commit, and changes no financial record.</p>
    <template data-if="mayMigrate">
      <button type="button" class="ef-button" id="migrate-books" data-event="migrateRequested">Update the books</button>
    </template>
    <button type="button" class="ef-button" data-variant="secondary" id="sign-out" data-event="signOutRequested">Sign out <span data-text="signedInLogin"></span></button>
  </main>
</template>

<template data-if="notAMember">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="not-member-title">
    <h1 id="not-member-title">You are not a member of these books</h1>
    <p>You are signed in as <span data-text="signedInLogin"></span>, but this organization has not given you access. Ask an administrator to add you.</p>
    <button type="button" class="ef-button" data-variant="secondary" id="sign-out" data-event="signOutRequested">Sign out</button>
  </main>
</template>

<template data-if="storeUnreachable">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="unreachable-title">
    <h1 id="unreachable-title">The books on GitHub could not be opened</h1>
    <p role="alert" id="store-problem" data-text="storeProblem"></p>
    <button type="button" class="ef-button" data-variant="secondary" id="sign-out" data-event="signOutRequested">Sign out <span data-text="signedInLogin"></span></button>
  </main>
</template>

<template data-if="isLoading">
  <main class="summa-gate" id="main" aria-busy="true"><p>Opening the books…</p></main>
</template>

<template data-if="isUntrustworthy">
  <main class="summa-gate ef-stack" id="main">
    <h1>The books failed their checks.</h1>
    <p>Summa does not run on books it cannot trust. These problems were found:</p>
    <ul id="storage-problems">
      <template data-each="storageProblems" data-key="key"><li data-text="problem"></li></template>
    </ul>
    <template data-if="canResetBooks">
      <div class="ef-stack">
        <p>You can start a new, empty set of books in this browser. The damaged copy is replaced.</p>
        <button type="button" class="ef-button" data-variant="danger" id="reset-books" commandfor="reset-dialog" command="show-modal">Start new books…</button>
        <dialog class="ef-dialog" id="reset-dialog" aria-labelledby="reset-dialog-title" aria-describedby="reset-dialog-description">
          <div class="ef-dialog__body">
            <h2 id="reset-dialog-title">Start new books?</h2>
            <p id="reset-dialog-description">The damaged books in this browser are replaced by new, empty books. This cannot be undone.</p>
          </div>
          <div class="ef-dialog__actions">
            <button type="button" class="ef-button" data-variant="secondary" id="reset-cancel" commandfor="reset-dialog" command="close">Keep the damaged books</button>
            <button type="button" class="ef-button" data-variant="danger" id="reset-confirm" data-event="resetConfirmed" commandfor="reset-dialog" command="close">Start new books</button>
          </div>
        </dialog>
      </div>
    </template>
  </main>
</template>

<template data-if="isReady">
<div class="summa-shell">
  <header class="summa-header">
    <p class="summa-brand"><span class="summa-brand__mark" aria-hidden="true">Σ</span><span data-text="organizationName"></span></p>
    <nav class="summa-nav" aria-label="Primary">
      <template data-each="navigation" data-key="id">
        <a class="summa-nav__link" data-bind-href="href" data-bind-aria-current="current" data-bind-data-route="id" data-text="label"></a>
      </template>
    </nav>
    <!-- One search over the books, and the command palette (v0.4 §18-19): typing opens #/search. -->
    <div class="summa-search" role="search">
      <label class="ef-visually-hidden" for="global-search">Search the books or run a command</label>
      <input id="global-search" type="search" placeholder="Search or run a command" autocomplete="off" data-event="globalSearchChanged" data-on="input" data-bind-value="globalSearch" />
    </div>
    <div class="summa-header__actions">
      <!-- Every view is a link (WI-0041): this copies the address of the one shown. -->
      <button type="button" class="ef-button" data-variant="secondary" id="copy-link" data-event="linkCopyRequested">Copy link</button>
      <a class="ef-button summa-new" id="new-invoice" href="#/invoices/new">New invoice</a>
      <template data-if="isSignedIn">
        <button type="button" class="ef-button" data-variant="secondary" id="header-sign-out" data-event="signOutRequested">Sign out <span data-text="signedInLogin"></span></button>
      </template>
    </div>
  </header>

  <main class="summa-main ef-stack" id="main" tabindex="-1">
    <div role="status" aria-live="polite" class="summa-messages">
      <template data-if="hasNotice"><p class="summa-notice" id="notice" data-text="notice"></p></template>
      <template data-if="hasNoticeEntry"><p class="summa-notice-action"><a class="summa-link" id="notice-entry" data-bind-href="noticeEntryHref">View accounting entry</a></p></template>
    </div>
    <template data-if="hasError"><p class="summa-error" id="error" role="alert" data-text="error"></p></template>
    <template data-if="isReadOnly"><p class="summa-notice" id="read-only">These books can only be read: <span data-text="readOnlyReasons"></span></p></template>
    <!-- Changes GitHub does not have yet (WI-0037): never dropped silently. -->
    <template data-if="hasUnsent">
      <div class="summa-unsent ef-stack" id="unsent" role="status">
        <p id="unsent-text" data-text="unsentText"></p>
        <template data-if="hasUnsentNote"><p id="unsent-note" data-text="unsentNote"></p></template>
        <template data-if="hasForeignUnsent">
          <div class="ef-stack" id="foreign-unsent">
            <p id="foreign-unsent-text" data-text="foreignUnsentText"></p>
            <p>They are held: Summa does not send them as you or drop them without your choice.</p>
            <div class="ef-actions">
              <button type="button" class="ef-button" data-variant="secondary" id="send-foreign" data-event="foreignUnsentSendRequested">Send them as me</button>
              <button type="button" class="ef-button" data-variant="danger" id="discard-foreign" data-event="foreignUnsentDiscardRequested">Discard them</button>
            </div>
          </div>
        </template>
        <template data-if="hasBlockedChange">
          <div class="ef-stack" id="blocked-change">
            <p>Waiting on: <strong id="blocked-summary" data-text="blockedSummary"></strong>. <span id="blocked-reason" data-text="blockedReason"></span></p>
            <p>The books show what GitHub holds. Give this change up to send the rest, then make it again if it is still needed.</p>
            <button type="button" class="ef-button" data-variant="danger" id="abandon-change" data-event="abandonUnsentRequested">Give this change up</button>
          </div>
        </template>
        <button type="button" class="ef-button" data-variant="secondary" id="send-unsent" data-event="sendUnsentRequested">Send now</button>
      </div>
    </template>
    <template data-if="hasCopyFallback">
      <div class="ef-field summa-copy-fallback"><label class="ef-field__label" for="copy-fallback">Link to this view</label>
        <input id="copy-fallback" type="text" readonly data-bind-value="copyFallback" /></div>
    </template>

    <!-- What a link that opens nothing says (SUM-LINK-007). Never a blank page. -->
    <template data-if="isNotFound">
      <section class="ef-stack summa-outcome" aria-labelledby="not-found-title">
        <h1 id="not-found-title">Nothing is at this link</h1>
        <p>The link names a page or a record these books do not have. It may have been mistyped, or the record may be in other books.</p>
        <p><a class="summa-link" href="#/">Go to the home page</a></p>
      </section>
    </template>
    <template data-if="isNotPermitted">
      <section class="ef-stack summa-outcome" aria-labelledby="not-permitted-title">
        <h1 id="not-permitted-title">You do not have access to this page</h1>
        <p>Your role in these books does not include it. Ask an administrator if you need it.</p>
        <p><a class="summa-link" href="#/">Go to the home page</a></p>
      </section>
    </template>
    <template data-if="isInvalidLink">
      <section class="ef-stack summa-outcome" aria-labelledby="invalid-link-title">
        <h1 id="invalid-link-title">This link cannot be opened</h1>
        <p id="invalid-link" data-text="invalidLink"></p>
        <p><a class="summa-link" href="#/">Go to the home page</a></p>
      </section>
    </template>
    <template data-if="isIssuedDraft">
      <section class="ef-stack summa-outcome" aria-labelledby="issued-draft-title">
        <h1 id="issued-draft-title">Draft <span data-text="issuedDraftId"></span> has been issued</h1>
        <p>An issued invoice cannot be edited. <a class="summa-link" id="issued-draft-invoice" data-bind-href="issuedDraftHref">Open the invoice</a></p>
      </section>
    </template>

    <!-- Home: what needs attention first (v0.4 §1, §10). -->
    <template data-if="onDashboard">
      <section class="ef-stack" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Home</h1>
        <div class="summa-metrics">
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Outstanding</p><p class="summa-metric__value" id="total-outstanding" data-text="totalOutstanding"></p></div>
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Overdue</p><p class="summa-metric__value" id="overdue-amount" data-text="overdueAmount"></p><p class="summa-metric__note"><span data-text="overdueCount"></span> invoices</p></div>
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Drafts</p><p class="summa-metric__value" id="draft-count" data-text="draftCount"></p></div>
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Invoices issued</p><p class="summa-metric__value" id="invoice-count" data-text="invoiceCount"></p></div>
          <!-- The work queue is where Summa raises anything (v0.4 §32). -->
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Needs attention</p><p class="summa-metric__value" id="work-count" data-text="workCount"></p><p class="summa-metric__note"><a class="summa-link" id="work-link" href="#/work">Open the work queue</a></p></div>
        </div>
        <template data-if="hasOverdue">
          <section class="ef-surface ef-stack" aria-labelledby="overdue-title">
            <h2 id="overdue-title">Overdue</h2>
            <div class="ef-data-grid" role="region" tabindex="0" aria-label="Overdue invoices">
              <table class="summa-table" id="overdue-table">
                <caption class="ef-visually-hidden">Overdue invoices</caption>
                <thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Due</th><th scope="col" class="summa-number">Outstanding</th></tr></thead>
                <tbody>
                  <template data-each="overdueInvoices" data-key="id">
                    <tr><td data-label="Invoice"><a class="summa-link" data-bind-href="href" data-text="number"></a></td><td data-text="customer" data-label="Customer"></td><td data-text="dueDate" data-label="Due"></td><td class="summa-number" data-text="outstanding" data-label="Outstanding"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
        </template>
        <template data-if="hasDrafts">
          <section class="ef-surface ef-stack" aria-labelledby="drafts-title">
            <h2 id="drafts-title">Drafts</h2>
            <div class="ef-data-grid" role="region" tabindex="0" aria-label="Draft invoices">
              <table class="summa-table" id="drafts-table">
                <caption class="ef-visually-hidden">Draft invoices</caption>
                <thead><tr><th scope="col">Draft</th><th scope="col">Customer</th><th scope="col">State</th><th scope="col" class="summa-number">Total</th></tr></thead>
                <tbody>
                  <template data-each="drafts" data-key="id">
                    <tr><td data-label="Draft"><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="customer" data-label="Customer"></td><td data-text="state" data-label="State"></td><td class="summa-number" data-text="total" data-label="Total"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
          </section>
        </template>
      </section>
    </template>

    <!-- Customers (v0.4 §3). -->
    <template data-if="onCustomers">
      <section class="ef-stack" aria-labelledby="customers-title">
        <h1 id="customers-title">Customers</h1>
        <template data-if="hasCustomers">
          <div class="summa-filters" role="search" aria-label="Customers">
            <div class="ef-field"><label class="ef-field__label" for="customer-search">Search</label>
              <input id="customer-search" type="search" data-event="customerSearchChanged" data-on="input" data-bind-value="customerSearch" /></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-sort">Sort by</label>
              <select id="customer-sort" data-event="customerSortChosen" data-bind-value="customerSort">
                <option value="name">Name</option><option value="balance">Open balance</option>
              </select></div>
            <label class="summa-check"><input id="customer-inactive" type="checkbox" data-event="customerInactiveToggled" data-on="change" data-bind-checked="customerInactive" /> Include inactive</label>
          </div>
        </template>
        <template data-if="noListedCustomers"><p id="no-customers">No customer matches.</p></template>
        <template data-if="hasListedCustomers">
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Customers">
            <table class="summa-table" id="customers-table">
              <caption class="ef-visually-hidden">Customers</caption>
              <thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Terms</th><th scope="col" class="summa-number">Open balance</th><th scope="col"><span class="ef-visually-hidden">Invoices</span></th></tr></thead>
              <tbody>
                <template data-each="customers" data-key="id">
                  <tr><td data-label="Name"><a class="summa-link" data-bind-href="href" data-text="name"></a></td><td data-text="email" data-label="Email"></td><td data-text="terms" data-label="Terms"></td><td class="summa-number" data-text="balance" data-label="Open balance"></td><td data-label="Invoices"><a class="summa-link" data-bind-href="invoicesHref">Invoices</a></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <form class="ef-surface ef-stack" id="customer-form" data-event="customerAdded" aria-labelledby="customer-form-title">
          <h2 id="customer-form-title">Add a customer</h2>
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="customer-name">Name</label>
              <input id="customer-name" type="text" required autocomplete="organization" data-event="customerNameChanged" data-on="input" data-bind-value="customerName" /></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-billing-name">Billing name</label>
              <input id="customer-billing-name" type="text" aria-describedby="customer-billing-note" data-event="customerBillingNameChanged" data-on="input" data-bind-value="customerBillingName" />
              <p class="ef-field__description" id="customer-billing-note">Shown on invoices. Leave empty to use the name.</p></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-email">Billing email</label>
              <input id="customer-email" type="email" autocomplete="email" data-event="customerEmailChanged" data-on="input" data-bind-value="customerEmail" /></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-terms">Payment terms (days)</label>
              <input id="customer-terms" type="text" inputmode="numeric" aria-describedby="customer-terms-note" data-event="customerTermsChanged" data-on="input" data-bind-value="customerTerms" />
              <p class="ef-field__description" id="customer-terms-note">0 for due on receipt. Leave empty for the organization's default.</p></div>
          </div>
          <div class="ef-field"><label class="ef-field__label" for="customer-address">Billing address</label>
            <textarea id="customer-address" rows="3" autocomplete="street-address" data-event="customerAddressChanged" data-on="input" data-bind-value="customerAddress"></textarea></div>
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="customer-tax-status">Tax status</label>
              <select id="customer-tax-status" aria-describedby="customer-tax-note" data-event="customerTaxStatusChosen" data-bind-value="customerTaxStatus">
                <template data-each="customerTaxOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select>
              <p class="ef-field__description" id="customer-tax-note">What you know of the customer's tax. Summa assumes nothing.</p></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-tax-jurisdiction">Tax jurisdiction</label>
              <input id="customer-tax-jurisdiction" type="text" data-event="customerTaxJurisdictionChanged" data-on="input" data-bind-value="customerTaxJurisdiction" /></div>
            <template data-if="customerTaxExempt"><div class="ef-field"><label class="ef-field__label" for="customer-tax-evidence">Exemption certificate or reference</label>
              <input id="customer-tax-evidence" type="text" required data-event="customerTaxEvidenceChanged" data-on="input" data-bind-value="customerTaxEvidence" /></div></template>
          </div>
          <label class="summa-check"><input id="customer-requires-po" type="checkbox" data-event="customerRequiresPurchaseOrderChanged" data-on="change" data-bind-checked="customerRequiresPurchaseOrder" /> Their accounts payable needs a purchase order on every invoice</label>
          <div class="ef-actions"><button type="submit" class="ef-button" id="add-customer">Add customer</button></div>
        </form>
      </section>
    </template>

    <!-- Invoice editor and review (v0.4 §4-6, INV-DRAFT, INV-REV). -->
    <template data-if="onEditor">
      <section class="ef-stack" aria-labelledby="editor-title">
        <h1 id="editor-title" data-text="draftLabel"></h1>
        <form class="ef-surface ef-stack" id="draft-form" data-event="draftSubmitted" aria-labelledby="editor-title">
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="draft-customer">Customer</label>
              <select id="draft-customer" data-event="draftCustomerChanged" data-bind-value="draftCustomer">
                <option value="">Choose a customer</option>
                <template data-each="customerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select>
              <p class="ef-field__description">Terms: <span id="draft-terms" data-text="draftCustomerTerms"></span>. Tax: <span id="draft-customer-tax" data-text="draftCustomerTax"></span></p>
              <p class="ef-field__description summa-optional-note" id="draft-bill-to" data-text="draftBillTo"></p>
              <p class="ef-field__description summa-optional-note" id="draft-rate-note" data-text="draftRateNote"></p></div>
            <template data-if="hasDraftEngagements">
              <div class="ef-field"><label class="ef-field__label" for="draft-engagement">Engagement</label>
                <select id="draft-engagement" data-event="draftEngagementChosen" data-bind-value="draftEngagement">
                  <option value="">No engagement</option>
                  <template data-each="draftEngagementOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
                </select>
                <p class="ef-field__description">Its terms and rates apply before the customer's.</p></div>
            </template>
            <div class="ef-field"><label class="ef-field__label" for="draft-po">Purchase order</label>
              <input id="draft-po" type="text" aria-describedby="draft-po-note" data-event="draftPurchaseOrderChanged" data-on="input" data-bind-value="draftPurchaseOrder" />
              <p class="ef-field__description summa-optional-note" id="draft-po-note" data-text="draftPurchaseOrderNote"></p></div>
          </div>
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Lines">
            <table class="summa-table summa-lines" id="draft-lines">
              <caption>Lines</caption>
              <thead><tr><th scope="col">Description</th><th scope="col">Quantity</th><th scope="col">Rate</th><th scope="col">Taxable</th><th scope="col"><span class="ef-visually-hidden">Remove</span></th></tr></thead>
              <tbody>
                <template data-each="draftLines" data-key="key">
                  <tr>
                    <td data-label="Description"><label class="summa-cell-label"><span class="ef-visually-hidden">Line <span data-text="position"></span> description</span><input type="text" class="line-description" data-event="lineDescriptionChanged" data-on="input" data-bind-value="description" /></label>
                      <button type="button" class="ef-button line-details" data-variant="secondary" data-event="lineDetailsOpened" commandfor="line-details" command="show-modal">Details<span data-text="detailsNote"></span><span class="ef-visually-hidden"> for line <span data-text="position"></span></span></button></td>
                    <td data-label="Quantity"><label class="summa-cell-label"><span class="ef-visually-hidden">Line <span data-text="position"></span> quantity</span><input type="text" inputmode="decimal" class="line-hours" data-event="lineHoursChanged" data-on="input" data-bind-value="hours" /></label></td>
                    <td data-label="Rate"><label class="summa-cell-label"><span class="ef-visually-hidden">Line <span data-text="position"></span> rate</span><input type="text" inputmode="decimal" class="line-rate" data-event="lineRateChanged" data-on="input" data-bind-value="rate" /></label></td>
                    <td data-label="Taxable"><label class="summa-check"><input type="checkbox" class="line-taxable" data-event="lineTaxableChanged" data-on="change" data-bind-checked="taxable" /><span class="ef-visually-hidden">Line <span data-text="position"></span> is taxable</span></label></td>
                    <td data-label="Remove"><button type="button" class="ef-button summa-remove" data-variant="secondary" data-event="lineRemoved">Remove</button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <dialog class="ef-flyout" id="line-details" data-ef-side="right" aria-labelledby="line-details-title" data-event="lineDetailsClosed" data-on="close">
            <div class="ef-flyout__surface">
              <header class="ef-flyout__header">
                <div>
                  <p class="ef-component-kicker">Line details</p>
                  <h2 id="line-details-title">Line <span data-text="detailsLinePosition"></span>: <span data-text="detailsLineDescription"></span></h2>
                </div>
                <button class="ef-flyout__close" type="button" commandfor="line-details" command="close" aria-label="Close the line details">Close</button>
              </header>
              <div class="ef-flyout__body summa-fields">
                <div class="ef-field"><label class="ef-field__label" for="line-detailed-description">Detailed description</label>
                  <textarea id="line-detailed-description" rows="2" data-event="lineDetailedDescriptionChanged" data-on="input" data-bind-value="lineDetailedDescription"></textarea></div>
                <div class="ef-field"><label class="ef-field__label" for="line-unit">Unit</label>
                  <input id="line-unit" type="text" placeholder="hours, days, items" data-event="lineUnitChanged" data-on="input" data-bind-value="lineUnit" /></div>
                <div class="ef-field"><label class="ef-field__label" for="line-service-from">Service from</label>
                  <input id="line-service-from" type="date" data-event="lineServiceFromChanged" data-on="input" data-bind-value="lineServiceFrom" /></div>
                <div class="ef-field"><label class="ef-field__label" for="line-service-to">Service to</label>
                  <input id="line-service-to" type="date" data-event="lineServiceToChanged" data-on="input" data-bind-value="lineServiceTo" /></div>
                <div class="ef-field"><label class="ef-field__label" for="line-category">Category</label>
                  <input id="line-category" type="text" data-event="lineCategoryChanged" data-on="input" data-bind-value="lineCategory" /></div>
                <div class="ef-field"><label class="ef-field__label" for="line-customer-code">Customer code</label>
                  <input id="line-customer-code" type="text" data-event="lineCustomerCodeChanged" data-on="input" data-bind-value="lineCustomerCode" /></div>
              </div>
              <footer class="ef-flyout__actions"><button type="button" class="ef-button" data-variant="secondary" id="line-details-done" commandfor="line-details" command="close">Done</button></footer>
            </div>
          </dialog>
          <div class="ef-actions"><button type="button" class="ef-button" data-variant="secondary" id="add-line" data-event="lineAdded">Add line</button>
            <p class="summa-total">Total <strong id="draft-total" data-text="draftTotal"></strong></p></div>
          <fieldset class="ef-stack summa-tax" id="draft-tax">
            <legend>Tax</legend>
            <p class="ef-field__description" id="draft-tax-note">Summa does not work tax out. Enter the tax you charge, and mark the lines it applies to.</p>
            <div class="summa-fields">
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-code">Tax code</label>
                <input id="draft-tax-code" type="text" aria-describedby="draft-tax-note" data-event="draftTaxCodeChanged" data-on="input" data-bind-value="draftTaxCode" /></div>
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-amount">Tax amount</label>
                <input id="draft-tax-amount" type="text" inputmode="decimal" data-event="draftTaxAmountChanged" data-on="input" data-bind-value="draftTaxAmount" /></div>
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-rate">Rate (%)</label>
                <input id="draft-tax-rate" type="text" inputmode="decimal" data-event="draftTaxRateChanged" data-on="input" data-bind-value="draftTaxRate" /></div>
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-account">Liability account</label>
                <select id="draft-tax-account" data-event="draftTaxAccountChosen" data-bind-value="draftTaxAccount">
                  <template data-each="taxAccountOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
                </select></div>
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-jurisdiction">Jurisdiction</label>
                <input id="draft-tax-jurisdiction" type="text" data-event="draftTaxJurisdictionChanged" data-on="input" data-bind-value="draftTaxJurisdiction" /></div>
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-source">Rate source</label>
                <input id="draft-tax-source" type="text" data-event="draftTaxRateSourceChanged" data-on="input" data-bind-value="draftTaxRateSource" /></div>
              <div class="ef-field"><label class="ef-field__label" for="draft-tax-evidence">Evidence or reference</label>
                <input id="draft-tax-evidence" type="text" data-event="draftTaxEvidenceChanged" data-on="input" data-bind-value="draftTaxEvidence" /></div>
            </div>
            <label class="summa-check"><input id="draft-tax-inclusive" type="checkbox" data-event="draftTaxInclusiveChanged" data-on="change" data-bind-checked="draftTaxInclusive" /> The line prices already include this tax</label>
          </fieldset>
          <fieldset class="ef-stack summa-references" id="draft-references">
            <legend>Client references</legend>
            <p class="ef-field__description" id="draft-references-note">References the customer asks to see beside the purchase order, such as a contract or cost center.</p>
            <template data-if="hasDraftReferences">
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="Client references">
                <table class="summa-table" id="draft-reference-rows">
                  <caption class="ef-visually-hidden">Client references</caption>
                  <thead><tr><th scope="col">Kind</th><th scope="col">Reference</th><th scope="col"><span class="ef-visually-hidden">Remove</span></th></tr></thead>
                  <tbody>
                    <template data-each="draftReferences" data-key="key">
                      <tr>
                        <td data-label="Kind"><label class="summa-cell-label"><span class="ef-visually-hidden">Reference <span data-text="position"></span> kind</span><select class="reference-kind" data-event="referenceKindChosen" data-bind-value="kind">
                          <option value="contract">Contract number</option>
                          <option value="engagement">Engagement number</option>
                          <option value="vendor">Vendor reference</option>
                          <option value="cost-center">Cost center</option>
                          <option value="matter">Matter number</option>
                        </select></label></td>
                        <td data-label="Reference"><label class="summa-cell-label"><span class="ef-visually-hidden">Reference <span data-text="position"></span></span><input type="text" class="reference-value" data-event="referenceValueChanged" data-on="input" data-bind-value="value" /></label></td>
                        <td data-label="Remove"><button type="button" class="ef-button summa-remove" data-variant="secondary" data-event="referenceRemoved">Remove</button></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
            <div class="ef-actions"><button type="button" class="ef-button" data-variant="secondary" id="add-reference" aria-describedby="draft-references-note" data-event="referenceAdded">Add reference</button></div>
          </fieldset>
          <div class="ef-field"><label class="ef-field__label" for="draft-notes">Note to the customer</label>
            <textarea id="draft-notes" rows="2" data-event="draftNotesChanged" data-on="input" data-bind-value="draftNotes"></textarea></div>
          <template data-if="hasBlockers">
            <section class="summa-blockers" id="blockers" aria-labelledby="blockers-title">
              <h2 id="blockers-title">Before this can be issued</h2>
              <ul>
                <template data-each="blockers" data-key="key"><li><strong data-text="explanation"></strong> <span data-text="resolution"></span></li></template>
              </ul>
            </section>
          </template>
          <template data-if="hasPreview">
            <section class="ef-stack summa-preview" id="invoice-preview" aria-labelledby="preview-title">
              <h2 id="preview-title">Preview: invoice <span data-text="previewNumber"></span> as it will be issued</h2>
              <ef-print-document class="summa-document">
                <header class="summa-document__head">
                  <div><p class="summa-document__issuer" data-text="previewIssuer"></p></div>
                  <dl class="summa-document__facts">
                    <div><dt>Invoice number</dt><dd data-text="previewNumber"></dd></div>
                    <div><dt>Issue date</dt><dd data-text="previewIssueDate"></dd></div>
                    <div><dt>Due date</dt><dd data-text="previewDueDate"></dd></div>
                    <div><dt>Payment terms</dt><dd data-text="previewTerms"></dd></div>
                  </dl>
                </header>
                <section aria-label="Bill to"><h3 class="summa-document__label">Bill to</h3><p data-text="previewCustomer"></p></section>
                <ef-print-table><table class="summa-table" id="preview-lines">
                  <caption>Lines</caption>
                  <thead><tr><th scope="col">Description</th><th scope="col" class="summa-number">Quantity</th><th scope="col" class="summa-number">Rate</th><th scope="col" class="summa-number">Amount</th></tr></thead>
                  <tbody><template data-each="previewLines" data-key="key"><tr><td data-text="description"></td><td class="summa-number" data-text="quantity"></td><td class="summa-number" data-text="rate"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
                </table></ef-print-table>
                <ef-print-keep><dl class="summa-document__totals"><template data-each="previewAdjustments" data-key="key"><div class="summa-adjustment"><dt data-text="label"></dt><dd data-text="amount"></dd></div></template><div class="summa-document__due"><dt>Total due</dt><dd id="preview-total" data-text="previewTotal"></dd></div></dl></ef-print-keep>
                <section aria-label="Payment instructions"><h3 class="summa-document__label">Payment instructions</h3><p class="summa-pre" id="preview-payment" data-text="previewPayment"></p></section>
              </ef-print-document>
            </section>
          </template>
          <div class="ef-actions">
            <button type="submit" class="ef-button" data-variant="secondary" id="review-draft">Save and review</button>
            <button type="button" class="ef-button" id="issue-invoice" commandfor="issue-dialog" command="show-modal" data-bind-disabled="cannotIssue">Issue invoice…</button>
            <dialog class="ef-dialog" id="issue-dialog" aria-labelledby="issue-dialog-title" aria-describedby="issue-dialog-text">
              <div class="ef-dialog__body">
                <h2 id="issue-dialog-title">Issue this invoice?</h2>
                <p id="issue-dialog-text" data-text="confirmIssueText"></p>
              </div>
              <div class="ef-dialog__actions">
                <button type="button" class="ef-button" data-variant="secondary" id="issue-dialog-cancel" commandfor="issue-dialog" command="close">Not yet</button>
                <button type="button" class="ef-button" id="confirm-issue" data-event="draftIssued" commandfor="issue-dialog" command="close">Issue invoice</button>
              </div>
            </dialog>
            <template data-if="editorChanged"><button type="button" class="ef-button" data-variant="secondary" id="discard-changes" data-event="editorDiscarded">Discard unsaved changes</button></template>
          </div>
        </form>
      </section>
    </template>

    <!-- Invoices (v0.4 §8). -->
    <template data-if="onInvoices">
      <section class="ef-stack" aria-labelledby="invoices-title">
        <h1 id="invoices-title">Invoices</h1>
        <template data-if="hasInvoices">
          <div class="ef-stack" id="invoice-list">
          <div class="summa-filters" role="search" aria-label="Invoices">
            <div class="ef-field"><label class="ef-field__label" for="invoice-search">Search number or customer</label>
              <input id="invoice-search" type="search" data-event="invoiceSearchChanged" data-on="input" data-bind-value="invoiceSearch" /></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-customer">Customer</label>
              <select id="invoice-customer" data-event="invoiceCustomerChosen" data-bind-value="invoiceCustomer">
                <option value="">All customers</option>
                <template data-each="invoiceCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-from">Issued from</label>
              <input id="invoice-from" type="date" data-event="invoiceFromChanged" data-on="change" data-bind-value="invoiceFrom" /></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-to">Issued to</label>
              <input id="invoice-to" type="date" data-event="invoiceToChanged" data-on="change" data-bind-value="invoiceTo" /></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-sort">Sort by</label>
              <select id="invoice-sort" data-event="invoiceSortChosen" data-bind-value="invoiceSort">
                <option value="attention">Needs attention first</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="due">Due date</option><option value="number">Number</option><option value="customer">Customer</option>
              </select></div>
            <fieldset class="summa-statuses"><legend>Status</legend>
              <template data-each="statusOptions" data-key="value">
                <label class="summa-check"><input type="checkbox" class="invoice-status" data-event="invoiceStatusToggled" data-on="change" data-bind-checked="checked" data-bind-data-status="value" /> <span data-text="label"></span></label>
              </template>
              <label class="summa-check"><input id="invoice-overdue" type="checkbox" data-event="invoiceOverdueToggled" data-on="change" data-bind-checked="invoiceOverdue" /> Overdue only</label>
            </fieldset>
            <template data-if="isFiltered"><button type="button" class="ef-button" data-variant="secondary" id="clear-filters" data-event="invoiceFiltersCleared">Clear filters</button></template>
          </div>
          <p class="summa-count" id="invoice-count-text" role="status" data-text="invoiceCountText"></p>
          <template data-if="noListedInvoices"><p id="no-invoices">No invoice matches these filters.</p></template>
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Issued invoices">
            <table class="summa-table" id="invoices-table">
              <caption class="ef-visually-hidden">Issued invoices</caption>
              <thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Issued</th><th scope="col">Due</th><th scope="col">Status</th><th scope="col">Needs attention</th><th scope="col" class="summa-number">Total</th><th scope="col" class="summa-number">Outstanding</th></tr></thead>
              <tbody>
                <template data-each="invoices" data-key="id">
                  <tr>
                    <td data-label="Invoice"><a class="summa-link" data-bind-href="href" data-text="number"></a></td>
                    <td data-text="customer" data-label="Customer"></td><td data-text="issueDate" data-label="Issued"></td><td data-text="dueDate" data-label="Due"></td>
                    <td data-label="Status"><span class="ef-status-lozenge" data-bind-data-state="statusTone" data-text="status"></span> <span class="summa-timing" data-text="timing"></span></td>
                    <td data-text="attention" data-label="Needs attention"></td>
                    <td class="summa-number" data-text="total" data-label="Total"></td><td class="summa-number" data-text="outstanding" data-label="Outstanding"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          </div>
        </template>
      </section>
    </template>

    <!-- One invoice: its Folio document, payments and actions. -->
    <template data-if="onInvoice">
      <template data-if="hasInvoice">
        <section class="ef-stack" aria-labelledby="invoice-title">
          <div class="summa-invoice-head">
            <h1 id="invoice-title">Invoice <span data-text="docNumber"></span></h1>
            <p><a class="summa-link" id="invoice-customer" data-bind-href="detailCustomerHref" data-text="detailCustomer"></a> · <span class="ef-status-lozenge" id="invoice-status" data-text="detailStatus"></span> Outstanding <strong id="invoice-outstanding" data-text="detailOutstanding"></strong></p>
          </div>
          <!-- The tab is part of the link (?tab=payments); choosing one refines the view. -->
          <div class="summa-tabs summa-screen-only" role="group" aria-label="Invoice views">
            <template data-each="invoiceTabs" data-key="value">
              <button type="button" class="summa-tab" data-event="invoiceTabChosen" data-bind-aria-pressed="selected" data-bind-data-tab="value" data-text="label"></button>
            </template>
          </div>
          <template data-if="onDocumentTab">
          <div class="ef-stack" id="document-tab">
          <template data-if="canPrint"><p class="summa-screen-only"><button type="button" class="ef-button" data-variant="secondary" id="print-invoice" data-event="printRequested">Print or save as PDF</button></p></template>
          <template data-if="canExport"><p class="summa-screen-only"><button type="button" class="ef-button" data-variant="secondary" id="export-invoice-json" data-event="invoiceJsonExported">Download (JSON)</button> <button type="button" class="ef-button" data-variant="secondary" id="export-invoice-html" data-event="invoiceHtmlExported">Download (HTML)</button></p></template>
          <ef-print-document class="summa-document" id="invoice-document">
            <ef-print-header repeat="page"><span slot="left" data-text="docIssuer"></span><span slot="right">Invoice <span data-text="docNumber"></span></span></ef-print-header>
            <header class="summa-document__head">
              <div><p class="summa-document__issuer" data-text="docIssuer"></p><p class="summa-pre" data-text="docIssuerAddress"></p><p data-text="docIssuerEmail"></p><template data-each="docIssuerLegal" data-key="key"><p class="summa-legal" data-text="line"></p></template></div>
              <dl class="summa-document__facts">
                <div><dt>Invoice number</dt><dd data-text="docNumber"></dd></div>
                <div><dt>Issue date</dt><dd data-text="docIssueDate"></dd></div>
                <div><dt>Due date</dt><dd data-text="docDueDate"></dd></div>
                <div><dt>Payment terms</dt><dd data-text="docTerms"></dd></div>
                <template data-if="docHasPurchaseOrder"><div><dt>Purchase order</dt><dd data-text="docPurchaseOrder"></dd></div></template>
                <template data-each="docReferences" data-key="key"><div class="summa-document__reference"><dt data-text="label"></dt><dd data-text="value"></dd></div></template>
              </dl>
            </header>
            <section aria-label="Bill to"><h2 class="summa-document__label">Bill to</h2><p data-text="docCustomer"></p><p class="summa-pre" data-text="docCustomerAddress"></p><template data-each="docCustomerLegal" data-key="key"><p class="summa-legal" data-text="line"></p></template></section>
            <ef-print-table><table class="summa-table" id="invoice-lines">
              <caption>Invoice lines</caption>
              <thead><tr><th scope="col">Description</th><th scope="col" class="summa-number">Quantity</th><th scope="col" class="summa-number">Rate</th><th scope="col" class="summa-number">Amount</th></tr></thead>
              <tbody>
                <template data-each="docLines" data-key="key"><tr><td><span data-text="description"></span><small class="summa-line-note" data-text="details"></small></td><td class="summa-number" data-text="quantity"></td><td class="summa-number" data-text="rate"></td><td class="summa-number" data-text="amount"></td></tr></template>
              </tbody>
            </table></ef-print-table>
            <ef-print-keep><dl class="summa-document__totals">
              <div><dt>Subtotal</dt><dd data-text="docSubtotal"></dd></div>
              <template data-each="docAdjustments" data-key="key"><div class="summa-adjustment"><dt data-text="label"></dt><dd data-text="amount"></dd></div></template>
              <div class="summa-document__due"><dt>Total due</dt><dd id="invoice-total" data-text="docTotal"></dd></div>
            </dl></ef-print-keep>
            <section aria-label="Payment instructions"><h2 class="summa-document__label">Payment instructions</h2><p class="summa-pre" data-text="docPayment"></p></section>
            <template data-if="docHasNotes"><section aria-label="Notes"><h2 class="summa-document__label">Notes</h2><p class="summa-pre" data-text="docNotes"></p></section></template>
            <template data-if="docHasStatutory"><section aria-label="Statutory information" id="invoice-statutory"><h2 class="summa-document__label">Statutory information</h2><template data-each="docStatutory" data-key="key"><p class="summa-pre" data-text="line"></p></template></section></template>
            <ef-print-footer repeat="page"><span slot="right"><ef-print-page-number format="page-of-pages"></ef-print-page-number></span></ef-print-footer>
          </ef-print-document>
          <section class="ef-surface ef-stack summa-screen-only" id="invoice-pdf-section" aria-labelledby="pdf-title">
            <h2 id="pdf-title">PDF</h2>
            <p id="pdf-status" role="status" data-text="pdfStatus"></p>
            <template data-if="canAttachPdf">
              <div class="ef-field"><label class="ef-field__label" for="invoice-pdf">Attach the PDF you saved from the print dialog</label>
                <input id="invoice-pdf" type="file" accept="application/pdf,.pdf" data-files-input="invoicePdf" /></div>
            </template>
            <template data-if="isPdfWorking"><p aria-busy="true">Working…</p></template>
            <template data-if="canDownloadPdf"><p><button type="button" class="ef-button" data-variant="secondary" id="download-pdf" data-event="pdfDownloadRequested">Download PDF</button></p></template>
          </section>
          </div>
          </template>

          <template data-if="onPaymentsTab">

          <section class="ef-surface ef-stack summa-screen-only" aria-labelledby="payments-title">
            <h2 id="payments-title">Payments and settlement</h2>
            <div class="ef-data-grid" role="region" tabindex="0" aria-label="Everything that settled this invoice, oldest first">
              <table class="summa-table" id="invoice-payments">
                <caption class="ef-visually-hidden">Everything that settled this invoice, oldest first</caption>
                <thead><tr><th scope="col">Date</th><th scope="col">What</th><th scope="col" class="summa-number">Amount</th><th scope="col" class="summa-number">Owed after</th></tr></thead>
                <tbody><template data-each="detailPayments" data-key="key"><tr><td data-text="date" data-label="Date"></td><td data-label="What"><a class="summa-link" data-bind-href="href" data-text="reference"></a></td><td class="summa-number" data-text="amount" data-label="Amount"></td><td class="summa-number" data-text="balance" data-label="Owed after"></td></tr></template></tbody>
              </table>
            </div>
            <template data-if="canRecordPayment">
              <form class="ef-stack" id="payment-form" data-event="paymentRecorded" aria-labelledby="payment-form-title">
                <h3 id="payment-form-title">Record a payment</h3>
                <div class="summa-fields">
                  <div class="ef-field"><label class="ef-field__label" for="payment-amount">Amount received</label>
                    <input id="payment-amount" type="text" inputmode="decimal" required data-event="paymentAmountChanged" data-on="input" data-bind-value="paymentAmount" /></div>
                  <div class="ef-field"><label class="ef-field__label" for="payment-date">Date received</label>
                    <input id="payment-date" type="date" data-event="paymentDateChanged" data-on="input" data-bind-value="paymentDate" /></div>
                  <div class="ef-field"><label class="ef-field__label" for="payment-method">Method</label>
                    <select id="payment-method" data-event="paymentMethodChanged" data-bind-value="paymentMethod">
                      <option value="ach">ACH</option><option value="check">Check</option><option value="wire">Wire</option><option value="credit-card">Card</option><option value="cash">Cash</option><option value="other">Other</option>
                    </select></div>
                  <div class="ef-field"><label class="ef-field__label" for="payment-reference">Reference</label>
                    <input id="payment-reference" type="text" data-event="paymentReferenceChanged" data-on="input" data-bind-value="paymentReference" /></div>
                </div>
                <div class="ef-actions"><button type="submit" class="ef-button" id="record-payment">Record payment</button></div>
              </form>
            </template>
            <section class="ef-stack" id="invoice-follow-up" aria-labelledby="follow-up-title">
              <h3 id="follow-up-title">Follow-up</h3>
              <p><span id="follow-up-collection" data-text="fuCollection"></span> <span id="follow-up-dispute" data-text="fuDispute"></span></p>
              <template data-if="canRecordPayment">
                <div class="ef-actions"><button type="button" class="ef-button" data-variant="secondary" id="record-reminder" data-event="reminderRecorded">Record a reminder sent</button></div>
              </template>
              <div class="ef-field"><label class="ef-field__label" for="follow-up-note">What the customer disputes, or how it was resolved</label>
                <input id="follow-up-note" type="text" data-event="followUpNoteChanged" data-on="input" data-bind-value="fuNote" /></div>
              <div class="ef-actions">
                <template data-if="fuNotDisputed"><button type="button" class="ef-button" data-variant="secondary" id="mark-disputed" data-event="disputeMarked">Mark disputed</button></template>
                <template data-if="fuDisputed"><button type="button" class="ef-button" data-variant="secondary" id="settle-dispute" data-event="disputeSettled">Resolve the dispute</button></template>
              </div>
              <h4 id="promise-title">Payment promise</h4>
              <p id="follow-up-promise" class="summa-optional-note" data-text="fuPromise"></p>
              <template data-if="canRecordPayment">
                <div class="ef-stack" role="group" aria-labelledby="promise-title">
                  <div class="summa-fields">
                    <div class="ef-field"><label class="ef-field__label" for="promise-amount">Amount promised</label>
                      <input id="promise-amount" type="text" inputmode="decimal" data-event="promiseAmountChanged" data-on="input" data-bind-value="promiseAmount" /></div>
                    <div class="ef-field"><label class="ef-field__label" for="promise-by">Promised by</label>
                      <input id="promise-by" type="date" data-event="promiseByChanged" data-on="input" data-bind-value="promiseBy" /></div>
                    <div class="ef-field"><label class="ef-field__label" for="promise-note">Who promised, and how</label>
                      <input id="promise-note" type="text" data-event="promiseNoteChanged" data-on="input" data-bind-value="promiseNote" /></div>
                  </div>
                  <div class="ef-actions">
                    <button type="button" class="ef-button" data-variant="secondary" id="record-promise" data-event="promiseRecorded">Record the promise</button>
                    <template data-if="fuHasPromise"><button type="button" class="ef-button" data-variant="secondary" id="withdraw-promise" data-event="promiseWithdrawn">Withdraw the promise</button></template>
                  </div>
                </div>
              </template>
            </section>
            <h3 id="credits-title">Credits applied</h3>
            <div class="ef-data-grid" role="region" tabindex="0" aria-label="Credits applied to this invoice">
              <table class="summa-table" id="invoice-credits">
                <caption class="ef-visually-hidden">Credits applied to this invoice</caption>
                <thead><tr><th scope="col">Applied</th><th scope="col">From</th><th scope="col" class="summa-number">Amount</th></tr></thead>
                <tbody><template data-each="detailCredits" data-key="key"><tr><td data-text="date" data-label="Applied"></td><td data-label="From"><a class="summa-link" data-bind-href="href" data-text="source"></a></td><td class="summa-number" data-text="amount" data-label="Amount"></td></tr></template></tbody>
              </table>
            </div>
            <template data-if="canRecordPayment">
              <form class="ef-stack" id="credit-form" aria-labelledby="credit-form-title">
                <h3 id="credit-form-title">Issue a credit memo</h3>
                <p class="ef-field__description">The invoice stays as issued. A credit memo reduces what is owed, and the customer receives it as its own document.</p>
                <div class="summa-fields">
                  <div class="ef-field"><label class="ef-field__label" for="credit-amount">Amount to credit</label>
                    <input id="credit-amount" type="text" inputmode="decimal" required data-event="creditAmountChanged" data-on="input" data-bind-value="creditAmount" /></div>
                  <div class="ef-field"><label class="ef-field__label" for="credit-reason">Reason, as the customer will read it</label>
                    <input id="credit-reason" type="text" required data-event="creditReasonChanged" data-on="input" data-bind-value="creditReason" /></div>
                </div>
                <div class="ef-actions"><button type="button" class="ef-button" data-variant="secondary" id="issue-credit" commandfor="credit-dialog" command="show-modal">Issue credit memo…</button></div>
                <dialog class="ef-dialog" id="credit-dialog" aria-labelledby="credit-dialog-title" aria-describedby="credit-dialog-text">
              <div class="ef-dialog__body">
                <h2 id="credit-dialog-title">Issue this credit memo?</h2>
                <p id="credit-dialog-text" data-text="confirmCreditText"></p>
              </div>
              <div class="ef-dialog__actions">
                <button type="button" class="ef-button" data-variant="secondary" id="credit-dialog-cancel" commandfor="credit-dialog" command="close">Not yet</button>
                <button type="button" class="ef-button" id="confirm-credit" data-event="creditMemoIssued" commandfor="credit-dialog" command="close">Issue credit memo</button>
              </div>
            </dialog>
              </form>
            </template>
          </section>
          </template>

          <template data-if="onHistoryTab">
            <section class="ef-surface ef-stack" aria-labelledby="history-title">
              <h2 id="history-title">History</h2>
              <p>Posted to the books as <a class="summa-link" id="invoice-entry" data-bind-href="detailEntryHref" data-text="detailEntryId"></a>.</p>
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="What happened to this invoice">
                <table class="summa-table" id="invoice-history">
                  <caption class="ef-visually-hidden">What happened to this invoice</caption>
                  <thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">What</th><th scope="col">Changed</th></tr></thead>
                  <tbody><template data-each="history" data-key="key"><tr><td data-text="when" data-label="When"></td><td data-text="who" data-label="Who"></td><td data-text="what" data-label="What"></td><td data-text="changed" data-label="Changed"></td></tr></template></tbody>
                </table>
              </div>
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="Where each line came from">
                <table class="summa-table" id="invoice-sources">
                  <caption>Where each line came from</caption>
                  <thead><tr><th scope="col">Line</th><th scope="col">Description</th><th scope="col">Source</th></tr></thead>
                  <tbody><template data-each="detailSources" data-key="key"><tr><td data-text="line" data-label="Line"></td><td data-text="description" data-label="Description"></td><td data-text="source" data-label="Source"></td></tr></template></tbody>
                </table>
              </div>
            </section>
          </template>
        </section>
      </template>
    </template>

    <!-- Receivables by age, on what is still outstanding (v0.4 §9, v0.2 §20). -->
    <template data-if="onReceivables">
      <section class="ef-stack" aria-labelledby="receivables-title">
        <h1 id="receivables-title">Receivables</h1>
        <div class="summa-filters" role="search" aria-label="Receivables">
          <div class="ef-field"><label class="ef-field__label" for="receivables-as-of">As of</label>
            <input id="receivables-as-of" type="date" data-event="receivablesAsOfChanged" data-on="change" data-bind-value="receivablesAsOf" /></div>
          <div class="ef-field"><label class="ef-field__label" for="receivables-customer">Customer</label>
            <select id="receivables-customer" data-event="receivablesCustomerChosen" data-bind-value="receivablesCustomer">
              <option value="">All customers</option>
              <template data-each="receivablesCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
        </div>
        <p class="summa-count" id="receivables-date">Aged as of <span data-text="receivablesDate"></span>.</p>
        <template data-if="hasAging">
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Receivables by age">
            <table class="summa-table" id="aging-table">
              <caption class="ef-visually-hidden">Receivables by age</caption>
              <thead><tr><th scope="col">Customer</th><th scope="col" class="summa-number">Not yet due</th><th scope="col" class="summa-number">1-30</th><th scope="col" class="summa-number">31-60</th><th scope="col" class="summa-number">61-90</th><th scope="col" class="summa-number">Over 90</th><th scope="col" class="summa-number">Total</th></tr></thead>
              <tbody>
                <template data-each="aging" data-key="key">
                  <tr><td data-text="customer" data-label="Customer"></td><td class="summa-number" data-text="current" data-label="Not yet due"></td><td class="summa-number" data-text="days1to30" data-label="1-30"></td><td class="summa-number" data-text="days31to60" data-label="31-60"></td><td class="summa-number" data-text="days61to90" data-label="61-90"></td><td class="summa-number" data-text="over90" data-label="Over 90"></td><td class="summa-number" data-text="total" data-label="Total"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </section>
    </template>

    <!-- Invoice proposals, an agent's among them: inspect, then approve or abandon (v0.4 §42-43, INV-AGENT-004). -->
    <!-- Search and the command palette (v0.4 §18-19): every result is a link. -->
    <template data-if="onSearch">
      <section class="ef-stack" aria-labelledby="search-title">
        <h1 id="search-title">Search</h1>
        <p id="search-summary" role="status" data-text="searchSummary"></p>
        <template data-if="hasSearchCommands">
          <div class="ef-stack">
            <h2>Commands</h2>
            <ul class="summa-palette" id="search-commands">
              <template data-each="searchCommands" data-key="key"><li><a class="summa-link" data-bind-href="href" data-text="label"></a></li></template>
            </ul>
          </div>
        </template>
        <template data-if="hasSearchResults">
          <div class="ef-stack">
            <h2>In the books</h2>
            <ul class="summa-search-results" id="search-results">
              <template data-each="searchResults" data-key="key">
                <li><span class="summa-search-kind" data-text="kind"></span> <a class="summa-link" data-bind-href="href" data-text="title"></a> <span data-text="detail"></span> <span class="summa-optional-note" data-text="matched"></span></li>
              </template>
            </ul>
          </div>
        </template>
      </section>
    </template>

    <template data-if="onProposals">
      <section class="ef-stack" aria-labelledby="proposals-title">
        <h1 id="proposals-title">Proposals</h1>
        <template data-if="noProposals"><p id="no-proposals">No invoice proposals. Proposals come from approved time, engagements and agents.</p></template>
        <template data-if="hasProposals">
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Invoice proposals">
            <table class="summa-table" id="proposals-table">
              <caption class="ef-visually-hidden">Invoice proposals</caption>
              <thead><tr><th scope="col">Proposal</th><th scope="col">Customer</th><th scope="col">Prepared by</th><th scope="col">State</th><th scope="col" class="summa-number">Total</th></tr></thead>
              <tbody>
                <template data-each="proposals" data-key="id">
                  <tr><td data-label="Proposal"><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="customer" data-label="Customer"></td><td data-text="preparedBy" data-label="Prepared by"></td><td data-text="state" data-label="State"></td><td class="summa-number" data-text="total" data-label="Total"></td></tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
        <section class="ef-surface ef-stack" aria-labelledby="import-title" id="time-import">
          <h2 id="import-title">Import time from Chrona</h2>
          <p>Paste the batch Chrona exported, one message per line. Summa checks every message and shows what it would do; nothing changes until you accept it.</p>
          <form class="ef-stack" id="import-form" data-event="importPreviewed">
            <div class="ef-field"><label class="ef-field__label" for="import-text">Chrona messages</label>
              <textarea id="import-text" rows="6" spellcheck="false" data-event="importTextChanged" data-on="input" data-bind-value="importText"></textarea></div>
            <div class="ef-actions"><button type="submit" class="ef-button" data-variant="secondary" id="preview-import">Preview</button></div>
          </form>
          <template data-if="hasImportPreview">
            <section class="ef-stack" aria-labelledby="import-preview-title" id="import-preview">
              <h3 id="import-preview-title">What this batch would do</h3>
              <p id="import-summary" role="status" data-text="importSummary"></p>
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="Accepted">
                <table class="summa-table" id="import-accepted">
                  <caption>Accepted</caption>
                  <thead><tr><th scope="col">Publication</th></tr></thead>
                  <tbody><template data-each="importAccepted" data-key="key"><tr><td data-text="id" data-label="Publication"></td></tr></template></tbody>
                </table>
              </div>
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="Rejected">
                <table class="summa-table" id="import-rejected">
                  <caption>Rejected</caption>
                  <thead><tr><th scope="col">Message</th><th scope="col">Why</th></tr></thead>
                  <tbody><template data-each="importRejected" data-key="key"><tr><td data-text="id" data-label="Message"></td><td data-text="reason" data-label="Why"></td></tr></template></tbody>
                </table>
              </div>
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="Duplicates (already received; they change nothing)">
                <table class="summa-table" id="import-duplicates">
                  <caption>Duplicates (already received; they change nothing)</caption>
                  <thead><tr><th scope="col">Publication</th></tr></thead>
                  <tbody><template data-each="importDuplicates" data-key="key"><tr><td data-text="id" data-label="Publication"></td></tr></template></tbody>
                </table>
              </div>
              <div class="ef-data-grid" role="region" tabindex="0" aria-label="Warnings">
                <table class="summa-table" id="import-warnings">
                  <caption>Warnings</caption>
                  <thead><tr><th scope="col">Publication</th><th scope="col">What to know</th></tr></thead>
                  <tbody><template data-each="importWarnings" data-key="key"><tr><td data-text="id" data-label="Publication"></td><td data-text="reason" data-label="What to know"></td></tr></template></tbody>
                </table>
              </div>
              <div class="ef-actions">
                <button type="button" class="ef-button" id="accept-import" data-event="importAccepted" data-bind-disabled="cannotAcceptImport">Accept and apply</button>
                <button type="button" class="ef-button" data-variant="secondary" id="discard-import" data-event="importDiscarded">Discard</button>
              </div>
            </section>
          </template>
        </section>
      </section>
    </template>

    <template data-if="onProposal">
      <section class="ef-stack" aria-labelledby="proposal-title">
        <h1 id="proposal-title">Proposal <span data-text="propId"></span></h1>
        <template data-if="propByAgent"><p class="summa-notice" id="proposal-agent-note" role="note">An agent prepared or changed this proposal. Check what it selected and assumed before you approve it.</p></template>
        <dl class="summa-facts">
          <div><dt>Customer</dt><dd><a class="summa-link" data-bind-href="propCustomerHref" data-text="propCustomer"></a></dd></div>
          <div><dt>Prepared by</dt><dd id="proposal-prepared-by" data-text="propPreparedBy"></dd></div>
          <div><dt>State</dt><dd id="proposal-state" data-text="propState"></dd></div>
          <div><dt>Total</dt><dd id="proposal-total" data-text="propTotal"></dd></div>
          <div><dt>Terms</dt><dd id="proposal-terms" data-text="propTerms"></dd></div>
        </dl>
        <template data-if="propIsIssued"><p><a class="summa-link" id="proposal-invoice" data-bind-href="propIssuedHref">Open the invoice it was issued as</a></p></template>
        <div class="ef-data-grid" role="region" tabindex="0" aria-label="Lines">
          <table class="summa-table" id="proposal-lines">
            <caption>Lines</caption>
            <thead><tr><th scope="col">Description</th><th scope="col" class="summa-number">Quantity</th><th scope="col" class="summa-number">Rate</th><th scope="col" class="summa-number">Amount</th></tr></thead>
            <tbody><template data-each="propLines" data-key="key"><tr><td data-text="description" data-label="Description"></td><td class="summa-number" data-text="quantity" data-label="Quantity"></td><td class="summa-number" data-text="rate" data-label="Rate"></td><td class="summa-number" data-text="amount" data-label="Amount"></td></tr></template></tbody>
          </table>
        </div>
        <section class="ef-surface ef-stack" id="proposal-explanation" aria-labelledby="explanation-title">
          <h2 id="explanation-title">How it was made</h2>
          <h3>Selected</h3>
          <ul id="proposal-selected"><template data-each="propSelected" data-key="key"><li data-text="text"></li></template></ul>
          <template data-if="propHasExcluded"><div class="ef-stack"><h3>Left out</h3><ul id="proposal-excluded"><template data-each="propExcluded" data-key="key"><li data-text="text"></li></template></ul></div></template>
          <h3>Grouping</h3>
          <p id="proposal-grouping" data-text="propGrouping"></p>
          <h3>Rates</h3>
          <ul id="proposal-rates"><template data-each="propRates" data-key="key"><li data-text="text"></li></template></ul>
          <template data-if="propHasAssumptions"><div class="ef-stack"><h3>Assumptions</h3><ul id="proposal-assumptions"><template data-each="propAssumptions" data-key="key"><li data-text="text"></li></template></ul></div></template>
        </section>
        <section class="ef-stack" id="proposal-contributions" aria-labelledby="contributions-title">
          <h2 id="contributions-title">Contributions</h2>
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Who contributed, oldest first">
            <table class="summa-table">
              <caption class="ef-visually-hidden">Who contributed, oldest first</caption>
              <thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">What</th></tr></thead>
              <tbody><template data-each="propContributions" data-key="key"><tr><td data-text="when" data-label="When"></td><td data-text="who" data-label="Who"></td><td data-text="what" data-label="What"></td></tr></template></tbody>
            </table>
          </div>
        </section>
        <template data-each="propActions" data-key="id">
          <div class="ef-stack" id="proposal-decision">
            <form class="ef-surface ef-stack" id="proposal-rate-form" data-event="proposalRateOverridden" aria-labelledby="proposal-rate-title">
              <h2 id="proposal-rate-title">Change a rate</h2>
              <div class="summa-fields">
                <div class="ef-field"><label class="ef-field__label" for="proposal-rate-line">Line</label>
                  <select id="proposal-rate-line" data-event="proposalLineChosen" data-bind-value="propRateLine">
                    <template data-each="propLineOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
                  </select></div>
                <div class="ef-field"><label class="ef-field__label" for="proposal-rate">New rate</label>
                  <input id="proposal-rate" type="text" inputmode="decimal" required data-event="proposalRateChanged" data-on="input" data-bind-value="propRate" /></div>
                <div class="ef-field"><label class="ef-field__label" for="proposal-rate-reason">Reason</label>
                  <input id="proposal-rate-reason" type="text" required data-event="proposalReasonChanged" data-on="input" data-bind-value="propRateReason" /></div>
              </div>
              <div class="ef-actions"><button type="submit" class="ef-button" data-variant="secondary" id="override-rate">Change rate</button></div>
            </form>
            <div class="ef-actions" id="proposal-actions">
              <button type="button" class="ef-button" id="approve-proposal" commandfor="approve-dialog" command="show-modal">Approve and issue invoice…</button>
            <dialog class="ef-dialog" id="approve-dialog" aria-labelledby="approve-dialog-title" aria-describedby="approve-dialog-text">
              <div class="ef-dialog__body">
                <h2 id="approve-dialog-title">Approve and issue?</h2>
                <p id="approve-dialog-text" data-text="confirmApproveText"></p>
              </div>
              <div class="ef-dialog__actions">
                <button type="button" class="ef-button" data-variant="secondary" id="approve-dialog-cancel" commandfor="approve-dialog" command="close">Not yet</button>
                <button type="button" class="ef-button" id="confirm-approve" data-event="proposalApproved" commandfor="approve-dialog" command="close">Approve and issue invoice</button>
              </div>
            </dialog>
              <button type="button" class="ef-button" data-variant="secondary" id="abandon-proposal" data-event="proposalAbandoned">Abandon proposal</button>
            </div>
          </div>
        </template>
      </section>
    </template>

    <!-- Engagements (v0.2 §16-17). -->
    <template data-if="onEngagements">
      <section class="ef-stack" aria-labelledby="engagements-title">
        <h1 id="engagements-title">Engagements</h1>
        <div class="summa-filters" role="search" aria-label="Engagements">
          <div class="ef-field"><label class="ef-field__label" for="engagements-customer">Customer</label>
            <select id="engagements-customer" data-event="engagementsCustomerChosen" data-bind-value="engagementCustomer">
              <option value="">All customers</option>
              <template data-each="engagementsCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
        </div>
        <template data-if="hasEngagements">
          <div class="ef-data-grid" role="region" tabindex="0" aria-label="Engagements">
            <table class="summa-table" id="engagements-table">
              <caption class="ef-visually-hidden">Engagements</caption>
              <thead><tr><th scope="col">Engagement</th><th scope="col">Customer</th><th scope="col">Fee</th></tr></thead>
