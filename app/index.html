<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Summa keeps a small business's invoices, receivables and books." />
<title>Summa</title>
<!-- An empty icon: without it Chromium requests /favicon.ico and logs a 404. -->
<link rel="icon" href="data:," />
<link rel="stylesheet" href="./summa-app.css" />
</head>
<body>
<!-- Structure and presentation only. Every value below is projected by the F#
     engine (src/Summa.Web.Engine/Accounting.fs) through Limen's data-*
     bindings, and every control sends a named event back to it. Forma owns
     presentation, Folio the printed invoice. Nothing here decides anything:
     readiness, issue, payments and totals are Summa's domain commands. -->
<a class="ef-skip-link" href="#main">Skip to content</a>

<template data-if="hasBanner">
  <p class="summa-banner" role="note" data-pages-banner data-text="environmentBanner"></p>
</template>

<template data-if="isConfiguring">
  <main class="summa-gate" id="main" aria-busy="true"><p>Opening Summa…</p></main>
</template>

<template data-if="isMisconfigured">
  <main class="summa-gate ef-stack" id="main">
    <h1>This deployment is not set up correctly.</h1>
    <p role="alert" id="misconfiguration" data-text="misconfiguration"></p>
  </main>
</template>

<template data-if="hasOperationalFault">
  <div class="ef-fault ef-fault--inline operational-fault" id="operational-fault" data-ef-intent="inline" data-ef-severity="error" role="alert" aria-labelledby="operational-fault-title">
    <div class="ef-fault__marker" aria-hidden="true">!</div>
    <div class="ef-fault__body">
      <p class="ef-fault__severity">Operational error</p>
      <p class="ef-fault__title" id="operational-fault-title"><strong data-text="operationalFaultTitle"></strong></p>
      <p class="ef-fault__message" data-text="operationalFaultMessage"></p>
      <p class="ef-fault-reference">Reference <code data-text="operationalFaultReference"></code></p>
    </div>
  </div>
</template>

<!-- Sign-in (WI-0035): Fides' client signs the person in with GitHub. Summa
     never sees a password or a token; the actor is GitHub's numeric id. -->
<template data-if="isRestoringSession">
  <main class="summa-gate" id="main" aria-busy="true"><p>Checking who is signed in…</p></main>
</template>

<template data-if="needsSignIn">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="sign-in-title">
    <h1 id="sign-in-title">Sign in to Summa</h1>
    <p>These books are kept on GitHub. Sign in with your GitHub account to open them.</p>
    <div role="status" aria-live="polite">
      <template data-if="hasSignInNotice"><p class="summa-notice" id="sign-in-notice" data-text="signInNotice"></p></template>
    </div>
    <label class="summa-check"><input type="checkbox" id="keep-sign-in" data-event="keepSignInToggled" data-on="change" data-bind-checked="keepInTab" /> Keep me signed in while this tab is open</label>
    <button type="button" class="ef-button" id="sign-in" data-event="signInRequested" data-bind-disabled="isLeavingForProvider">Sign in with GitHub</button>
  </main>
</template>

<template data-if="awaitsGitHubStore">
  <main class="summa-gate ef-stack" id="main" aria-labelledby="signed-in-title">
    <h1 id="signed-in-title">Signed in as <span id="signed-in-login" data-text="signedInLogin"></span></h1>
    <p>This build of Summa cannot open books kept on GitHub yet.</p>
    <button type="button" class="ef-button" data-variant="secondary" id="sign-out" data-event="signOutRequested">Sign out</button>
  </main>
</template>

<template data-if="isLoading">
  <main class="summa-gate" id="main" aria-busy="true"><p>Opening the books…</p></main>
</template>

<template data-if="isUntrustworthy">
  <main class="summa-gate ef-stack" id="main">
    <h1>The books in this browser failed their checks.</h1>
    <p>Summa does not run on books it cannot trust. These problems were found:</p>
    <ul id="storage-problems">
      <template data-each="storageProblems" data-key="key"><li data-text="problem"></li></template>
    </ul>
    <p>You can start a new, empty set of books in this browser. The damaged copy is replaced.</p>
    <button type="button" class="ef-button" data-variant="danger" id="reset-books" data-event="resetConfirmed">Start new books</button>
  </main>
</template>

<template data-if="isReady">
<div class="summa-shell">
  <header class="summa-header">
    <p class="summa-brand"><span class="summa-brand__mark" aria-hidden="true">Σ</span><span data-text="organizationName"></span></p>
    <nav class="summa-nav" aria-label="Primary">
      <template data-each="navigation" data-key="id">
        <a class="summa-nav__link" data-bind-href="href" data-bind-aria-current="current" data-bind-data-route="id" data-text="label"></a>
      </template>
    </nav>
    <div class="summa-header__actions">
      <!-- Every view is a link (WI-0041): this copies the address of the one shown. -->
      <button type="button" class="ef-button" data-variant="secondary" id="copy-link" data-event="linkCopyRequested">Copy link</button>
      <a class="ef-button summa-new" id="new-invoice" href="#/invoices/new">New invoice</a>
      <template data-if="isSignedIn">
        <button type="button" class="ef-button" data-variant="secondary" id="header-sign-out" data-event="signOutRequested">Sign out <span data-text="signedInLogin"></span></button>
      </template>
    </div>
  </header>

  <main class="summa-main ef-stack" id="main" tabindex="-1">
    <div role="status" aria-live="polite" class="summa-messages">
      <template data-if="hasNotice"><p class="summa-notice" id="notice" data-text="notice"></p></template>
    </div>
    <template data-if="hasError"><p class="summa-error" id="error" role="alert" data-text="error"></p></template>
    <template data-if="hasCopyFallback">
      <div class="ef-field summa-copy-fallback"><label class="ef-field__label" for="copy-fallback">Link to this view</label>
        <input id="copy-fallback" type="text" readonly data-bind-value="copyFallback" /></div>
    </template>

    <!-- What a link that opens nothing says (SUM-LINK-007). Never a blank page. -->
    <template data-if="isNotFound">
      <section class="ef-stack summa-outcome" aria-labelledby="not-found-title">
        <h1 id="not-found-title">Nothing is at this link</h1>
        <p>The link names a page or a record these books do not have. It may have been mistyped, or the record may be in other books.</p>
        <p><a class="summa-link" href="#/">Go to the home page</a></p>
      </section>
    </template>
    <template data-if="isNotPermitted">
      <section class="ef-stack summa-outcome" aria-labelledby="not-permitted-title">
        <h1 id="not-permitted-title">You do not have access to this page</h1>
        <p>Your role in these books does not include it. Ask an administrator if you need it.</p>
        <p><a class="summa-link" href="#/">Go to the home page</a></p>
      </section>
    </template>
    <template data-if="isInvalidLink">
      <section class="ef-stack summa-outcome" aria-labelledby="invalid-link-title">
        <h1 id="invalid-link-title">This link cannot be opened</h1>
        <p id="invalid-link" data-text="invalidLink"></p>
        <p><a class="summa-link" href="#/">Go to the home page</a></p>
      </section>
    </template>
    <template data-if="isIssuedDraft">
      <section class="ef-stack summa-outcome" aria-labelledby="issued-draft-title">
        <h1 id="issued-draft-title">Draft <span data-text="issuedDraftId"></span> has been issued</h1>
        <p>An issued invoice cannot be edited. <a class="summa-link" id="issued-draft-invoice" data-bind-href="issuedDraftHref">Open the invoice</a></p>
      </section>
    </template>

    <!-- Home: what needs attention first (v0.4 §1, §10). -->
    <template data-if="onDashboard">
      <section class="ef-stack" aria-labelledby="dashboard-title">
        <h1 id="dashboard-title">Home</h1>
        <div class="summa-metrics">
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Outstanding</p><p class="summa-metric__value" id="total-outstanding" data-text="totalOutstanding"></p></div>
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Overdue</p><p class="summa-metric__value" id="overdue-amount" data-text="overdueAmount"></p><p class="summa-metric__note"><span data-text="overdueCount"></span> invoices</p></div>
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Drafts</p><p class="summa-metric__value" id="draft-count" data-text="draftCount"></p></div>
          <div class="ef-surface summa-metric"><p class="summa-metric__label">Invoices issued</p><p class="summa-metric__value" id="invoice-count" data-text="invoiceCount"></p></div>
        </div>
        <template data-if="hasOverdue">
          <section class="ef-surface ef-stack" aria-labelledby="overdue-title">
            <h2 id="overdue-title">Overdue</h2>
            <table class="summa-table" id="overdue-table">
              <caption class="ef-visually-hidden">Overdue invoices</caption>
              <thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Due</th><th scope="col" class="summa-number">Outstanding</th></tr></thead>
              <tbody>
                <template data-each="overdueInvoices" data-key="id">
                  <tr><td><a class="summa-link" data-bind-href="href" data-text="number"></a></td><td data-text="customer"></td><td data-text="dueDate"></td><td class="summa-number" data-text="outstanding"></td></tr>
                </template>
              </tbody>
            </table>
          </section>
        </template>
        <template data-if="hasDrafts">
          <section class="ef-surface ef-stack" aria-labelledby="drafts-title">
            <h2 id="drafts-title">Drafts</h2>
            <table class="summa-table" id="drafts-table">
              <caption class="ef-visually-hidden">Draft invoices</caption>
              <thead><tr><th scope="col">Draft</th><th scope="col">Customer</th><th scope="col">State</th><th scope="col" class="summa-number">Total</th></tr></thead>
              <tbody>
                <template data-each="drafts" data-key="id">
                  <tr><td><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="customer"></td><td data-text="state"></td><td class="summa-number" data-text="total"></td></tr>
                </template>
              </tbody>
            </table>
          </section>
        </template>
      </section>
    </template>

    <!-- Customers (v0.4 §3). -->
    <template data-if="onCustomers">
      <section class="ef-stack" aria-labelledby="customers-title">
        <h1 id="customers-title">Customers</h1>
        <template data-if="hasCustomers">
          <div class="summa-filters" role="search" aria-label="Customers">
            <div class="ef-field"><label class="ef-field__label" for="customer-search">Search</label>
              <input id="customer-search" type="search" data-event="customerSearchChanged" data-on="input" data-bind-value="customerSearch" /></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-sort">Sort by</label>
              <select id="customer-sort" data-event="customerSortChosen" data-bind-value="customerSort">
                <option value="name">Name</option><option value="balance">Open balance</option>
              </select></div>
            <label class="summa-check"><input id="customer-inactive" type="checkbox" data-event="customerInactiveToggled" data-on="change" data-bind-checked="customerInactive" /> Include inactive</label>
          </div>
        </template>
        <template data-if="noListedCustomers"><p id="no-customers">No customer matches.</p></template>
        <template data-if="hasListedCustomers">
          <table class="summa-table" id="customers-table">
            <caption class="ef-visually-hidden">Customers</caption>
            <thead><tr><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Terms</th><th scope="col" class="summa-number">Open balance</th><th scope="col"><span class="ef-visually-hidden">Invoices</span></th></tr></thead>
            <tbody>
              <template data-each="customers" data-key="id">
                <tr><td><a class="summa-link" data-bind-href="href" data-text="name"></a></td><td data-text="email"></td><td data-text="terms"></td><td class="summa-number" data-text="balance"></td><td><a class="summa-link" data-bind-href="invoicesHref">Invoices</a></td></tr>
              </template>
            </tbody>
          </table>
        </template>
        <form class="ef-surface ef-stack" id="customer-form" data-event="customerAdded" aria-labelledby="customer-form-title">
          <h2 id="customer-form-title">Add a customer</h2>
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="customer-name">Name</label>
              <input id="customer-name" type="text" required autocomplete="organization" data-event="customerNameChanged" data-on="input" data-bind-value="customerName" /></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-billing-name">Billing name</label>
              <input id="customer-billing-name" type="text" aria-describedby="customer-billing-note" data-event="customerBillingNameChanged" data-on="input" data-bind-value="customerBillingName" />
              <p class="ef-field__description" id="customer-billing-note">Shown on invoices. Leave empty to use the name.</p></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-email">Billing email</label>
              <input id="customer-email" type="email" autocomplete="email" data-event="customerEmailChanged" data-on="input" data-bind-value="customerEmail" /></div>
            <div class="ef-field"><label class="ef-field__label" for="customer-terms">Payment terms (days)</label>
              <input id="customer-terms" type="text" inputmode="numeric" aria-describedby="customer-terms-note" data-event="customerTermsChanged" data-on="input" data-bind-value="customerTerms" />
              <p class="ef-field__description" id="customer-terms-note">0 for due on receipt. Leave empty for the organization's default.</p></div>
          </div>
          <div class="ef-field"><label class="ef-field__label" for="customer-address">Billing address</label>
            <textarea id="customer-address" rows="3" autocomplete="street-address" data-event="customerAddressChanged" data-on="input" data-bind-value="customerAddress"></textarea></div>
          <div class="ef-actions"><button type="submit" class="ef-button" id="add-customer">Add customer</button></div>
        </form>
      </section>
    </template>

    <!-- Invoice editor and review (v0.4 §4-6, INV-DRAFT, INV-REV). -->
    <template data-if="onEditor">
      <section class="ef-stack" aria-labelledby="editor-title">
        <h1 id="editor-title" data-text="draftLabel"></h1>
        <form class="ef-surface ef-stack" id="draft-form" data-event="draftSubmitted" aria-labelledby="editor-title">
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="draft-customer">Customer</label>
              <select id="draft-customer" data-event="draftCustomerChanged" data-bind-value="draftCustomer">
                <option value="">Choose a customer</option>
                <template data-each="customerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select>
              <p class="ef-field__description">Terms: <span id="draft-terms" data-text="draftCustomerTerms"></span></p></div>
            <div class="ef-field"><label class="ef-field__label" for="draft-po">Purchase order</label>
              <input id="draft-po" type="text" data-event="draftPurchaseOrderChanged" data-on="input" data-bind-value="draftPurchaseOrder" /></div>
          </div>
          <table class="summa-table summa-lines" id="draft-lines">
            <caption>Lines</caption>
            <thead><tr><th scope="col">Description</th><th scope="col">Quantity</th><th scope="col">Rate</th><th scope="col"><span class="ef-visually-hidden">Remove</span></th></tr></thead>
            <tbody>
              <template data-each="draftLines" data-key="key">
                <tr>
                  <td><label class="ef-visually-hidden">Line <span data-text="position"></span> description<input type="text" class="line-description" data-event="lineDescriptionChanged" data-on="input" data-bind-value="description" /></label></td>
                  <td><label class="ef-visually-hidden">Line <span data-text="position"></span> quantity<input type="text" inputmode="decimal" class="line-hours" data-event="lineHoursChanged" data-on="input" data-bind-value="hours" /></label></td>
                  <td><label class="ef-visually-hidden">Line <span data-text="position"></span> rate<input type="text" inputmode="decimal" class="line-rate" data-event="lineRateChanged" data-on="input" data-bind-value="rate" /></label></td>
                  <td><button type="button" class="ef-button summa-remove" data-variant="secondary" data-event="lineRemoved">Remove</button></td>
                </tr>
              </template>
            </tbody>
          </table>
          <div class="ef-actions"><button type="button" class="ef-button" data-variant="secondary" id="add-line" data-event="lineAdded">Add line</button>
            <p class="summa-total">Total <strong id="draft-total" data-text="draftTotal"></strong></p></div>
          <div class="ef-field"><label class="ef-field__label" for="draft-notes">Note to the customer</label>
            <textarea id="draft-notes" rows="2" data-event="draftNotesChanged" data-on="input" data-bind-value="draftNotes"></textarea></div>
          <template data-if="hasBlockers">
            <section class="summa-blockers" id="blockers" aria-labelledby="blockers-title">
              <h2 id="blockers-title">Before this can be issued</h2>
              <ul>
                <template data-each="blockers" data-key="key"><li><strong data-text="explanation"></strong> <span data-text="resolution"></span></li></template>
              </ul>
            </section>
          </template>
          <template data-if="hasPreview">
            <section class="ef-stack summa-preview" id="invoice-preview" aria-labelledby="preview-title">
              <h2 id="preview-title">Preview: invoice <span data-text="previewNumber"></span> as it will be issued</h2>
              <ef-print-document class="summa-document">
                <header class="summa-document__head">
                  <div><p class="summa-document__issuer" data-text="previewIssuer"></p></div>
                  <dl class="summa-document__facts">
                    <div><dt>Invoice number</dt><dd data-text="previewNumber"></dd></div>
                    <div><dt>Issue date</dt><dd data-text="previewIssueDate"></dd></div>
                    <div><dt>Due date</dt><dd data-text="previewDueDate"></dd></div>
                    <div><dt>Payment terms</dt><dd data-text="previewTerms"></dd></div>
                  </dl>
                </header>
                <section aria-label="Bill to"><h3 class="summa-document__label">Bill to</h3><p data-text="previewCustomer"></p></section>
                <ef-print-table><table class="summa-table" id="preview-lines">
                  <caption>Lines</caption>
                  <thead><tr><th scope="col">Description</th><th scope="col" class="summa-number">Quantity</th><th scope="col" class="summa-number">Rate</th><th scope="col" class="summa-number">Amount</th></tr></thead>
                  <tbody><template data-each="previewLines" data-key="key"><tr><td data-text="description"></td><td class="summa-number" data-text="quantity"></td><td class="summa-number" data-text="rate"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
                </table></ef-print-table>
                <ef-print-keep><dl class="summa-document__totals"><div class="summa-document__due"><dt>Total due</dt><dd id="preview-total" data-text="previewTotal"></dd></div></dl></ef-print-keep>
                <section aria-label="Payment instructions"><h3 class="summa-document__label">Payment instructions</h3><p class="summa-pre" id="preview-payment" data-text="previewPayment"></p></section>
              </ef-print-document>
            </section>
          </template>
          <div class="ef-actions">
            <button type="submit" class="ef-button" data-variant="secondary" id="review-draft">Save and review</button>
            <button type="button" class="ef-button" id="issue-invoice" data-event="draftIssued" data-bind-disabled="cannotIssue">Issue invoice</button>
          </div>
        </form>
      </section>
    </template>

    <!-- Invoices (v0.4 §8). -->
    <template data-if="onInvoices">
      <section class="ef-stack" aria-labelledby="invoices-title">
        <h1 id="invoices-title">Invoices</h1>
        <template data-if="hasInvoices">
          <div class="ef-stack" id="invoice-list">
          <div class="summa-filters" role="search" aria-label="Invoices">
            <div class="ef-field"><label class="ef-field__label" for="invoice-search">Search number or customer</label>
              <input id="invoice-search" type="search" data-event="invoiceSearchChanged" data-on="input" data-bind-value="invoiceSearch" /></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-customer">Customer</label>
              <select id="invoice-customer" data-event="invoiceCustomerChosen" data-bind-value="invoiceCustomer">
                <option value="">All customers</option>
                <template data-each="invoiceCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-from">Issued from</label>
              <input id="invoice-from" type="date" data-event="invoiceFromChanged" data-on="change" data-bind-value="invoiceFrom" /></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-to">Issued to</label>
              <input id="invoice-to" type="date" data-event="invoiceToChanged" data-on="change" data-bind-value="invoiceTo" /></div>
            <div class="ef-field"><label class="ef-field__label" for="invoice-sort">Sort by</label>
              <select id="invoice-sort" data-event="invoiceSortChosen" data-bind-value="invoiceSort">
                <option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="due">Due date</option><option value="number">Number</option><option value="customer">Customer</option>
              </select></div>
            <fieldset class="summa-statuses"><legend>Status</legend>
              <template data-each="statusOptions" data-key="value">
                <label class="summa-check"><input type="checkbox" class="invoice-status" data-event="invoiceStatusToggled" data-on="change" data-bind-checked="checked" data-bind-data-status="value" /> <span data-text="label"></span></label>
              </template>
              <label class="summa-check"><input id="invoice-overdue" type="checkbox" data-event="invoiceOverdueToggled" data-on="change" data-bind-checked="invoiceOverdue" /> Overdue only</label>
            </fieldset>
            <template data-if="isFiltered"><button type="button" class="ef-button" data-variant="secondary" id="clear-filters" data-event="invoiceFiltersCleared">Clear filters</button></template>
          </div>
          <p class="summa-count" id="invoice-count-text" role="status" data-text="invoiceCountText"></p>
          <template data-if="noListedInvoices"><p id="no-invoices">No invoice matches these filters.</p></template>
          <table class="summa-table" id="invoices-table">
            <caption class="ef-visually-hidden">Issued invoices</caption>
            <thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Issued</th><th scope="col">Due</th><th scope="col">Status</th><th scope="col" class="summa-number">Total</th><th scope="col" class="summa-number">Outstanding</th></tr></thead>
            <tbody>
              <template data-each="invoices" data-key="id">
                <tr>
                  <td><a class="summa-link" data-bind-href="href" data-text="number"></a></td>
                  <td data-text="customer"></td><td data-text="issueDate"></td><td data-text="dueDate"></td>
                  <td><span class="ef-status-lozenge" data-bind-data-state="statusTone" data-text="status"></span> <span class="summa-timing" data-text="timing"></span></td>
                  <td class="summa-number" data-text="total"></td><td class="summa-number" data-text="outstanding"></td>
                </tr>
              </template>
            </tbody>
          </table>
          </div>
        </template>
      </section>
    </template>

    <!-- One invoice: its Folio document, payments and actions. -->
    <template data-if="onInvoice">
      <template data-if="hasInvoice">
        <section class="ef-stack" aria-labelledby="invoice-title">
          <div class="summa-invoice-head">
            <h1 id="invoice-title">Invoice <span data-text="docNumber"></span></h1>
            <p><a class="summa-link" id="invoice-customer" data-bind-href="detailCustomerHref" data-text="detailCustomer"></a> · <span class="ef-status-lozenge" id="invoice-status" data-text="detailStatus"></span> Outstanding <strong id="invoice-outstanding" data-text="detailOutstanding"></strong></p>
          </div>
          <!-- The tab is part of the link (?tab=payments); choosing one refines the view. -->
          <div class="summa-tabs summa-screen-only" role="group" aria-label="Invoice views">
            <template data-each="invoiceTabs" data-key="value">
              <button type="button" class="summa-tab" data-event="invoiceTabChosen" data-bind-aria-pressed="selected" data-bind-data-tab="value" data-text="label"></button>
            </template>
          </div>
          <template data-if="onDocumentTab">
          <div class="ef-stack" id="document-tab">
          <template data-if="canPrint"><p class="summa-screen-only"><button type="button" class="ef-button" data-variant="secondary" id="print-invoice" data-event="printRequested">Print or save as PDF</button></p></template>
          <ef-print-document class="summa-document" id="invoice-document">
            <ef-print-header repeat="page"><span slot="left" data-text="docIssuer"></span><span slot="right">Invoice <span data-text="docNumber"></span></span></ef-print-header>
            <header class="summa-document__head">
              <div><p class="summa-document__issuer" data-text="docIssuer"></p><p class="summa-pre" data-text="docIssuerAddress"></p><p data-text="docIssuerEmail"></p></div>
              <dl class="summa-document__facts">
                <div><dt>Invoice number</dt><dd data-text="docNumber"></dd></div>
                <div><dt>Issue date</dt><dd data-text="docIssueDate"></dd></div>
                <div><dt>Due date</dt><dd data-text="docDueDate"></dd></div>
                <div><dt>Payment terms</dt><dd data-text="docTerms"></dd></div>
                <template data-if="docHasPurchaseOrder"><div><dt>Purchase order</dt><dd data-text="docPurchaseOrder"></dd></div></template>
              </dl>
            </header>
            <section aria-label="Bill to"><h2 class="summa-document__label">Bill to</h2><p data-text="docCustomer"></p><p class="summa-pre" data-text="docCustomerAddress"></p></section>
            <ef-print-table><table class="summa-table" id="invoice-lines">
              <caption>Invoice lines</caption>
              <thead><tr><th scope="col">Description</th><th scope="col" class="summa-number">Quantity</th><th scope="col" class="summa-number">Rate</th><th scope="col" class="summa-number">Amount</th></tr></thead>
              <tbody>
                <template data-each="docLines" data-key="key"><tr><td data-text="description"></td><td class="summa-number" data-text="quantity"></td><td class="summa-number" data-text="rate"></td><td class="summa-number" data-text="amount"></td></tr></template>
              </tbody>
            </table></ef-print-table>
            <ef-print-keep><dl class="summa-document__totals">
              <div><dt>Subtotal</dt><dd data-text="docSubtotal"></dd></div>
              <div class="summa-document__due"><dt>Total due</dt><dd id="invoice-total" data-text="docTotal"></dd></div>
            </dl></ef-print-keep>
            <section aria-label="Payment instructions"><h2 class="summa-document__label">Payment instructions</h2><p class="summa-pre" data-text="docPayment"></p></section>
            <template data-if="docHasNotes"><section aria-label="Notes"><h2 class="summa-document__label">Notes</h2><p class="summa-pre" data-text="docNotes"></p></section></template>
            <ef-print-footer repeat="page"><span slot="right"><ef-print-page-number format="page-of-pages"></ef-print-page-number></span></ef-print-footer>
          </ef-print-document>
          <section class="ef-surface ef-stack summa-screen-only" id="invoice-pdf-section" aria-labelledby="pdf-title">
            <h2 id="pdf-title">PDF</h2>
            <p id="pdf-status" role="status" data-text="pdfStatus"></p>
            <template data-if="canAttachPdf">
              <div class="ef-field"><label class="ef-field__label" for="invoice-pdf">Attach the PDF you saved from the print dialog</label>
                <input id="invoice-pdf" type="file" accept="application/pdf,.pdf" data-files-input="invoicePdf" /></div>
            </template>
            <template data-if="isPdfWorking"><p aria-busy="true">Working…</p></template>
            <template data-if="canDownloadPdf"><p><button type="button" class="ef-button" data-variant="secondary" id="download-pdf" data-event="pdfDownloadRequested">Download PDF</button></p></template>
          </section>
          </div>
          </template>

          <template data-if="onPaymentsTab">

          <section class="ef-surface ef-stack summa-screen-only" aria-labelledby="payments-title">
            <h2 id="payments-title">Payments</h2>
            <table class="summa-table" id="invoice-payments">
              <caption class="ef-visually-hidden">Payments applied</caption>
              <thead><tr><th scope="col">Received</th><th scope="col">Reference</th><th scope="col" class="summa-number">Amount</th></tr></thead>
              <tbody><template data-each="detailPayments" data-key="key"><tr><td data-text="date"></td><td data-text="reference"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
            </table>
            <template data-if="canRecordPayment">
              <form class="ef-stack" id="payment-form" data-event="paymentRecorded" aria-labelledby="payment-form-title">
                <h3 id="payment-form-title">Record a payment</h3>
                <div class="summa-fields">
                  <div class="ef-field"><label class="ef-field__label" for="payment-amount">Amount received</label>
                    <input id="payment-amount" type="text" inputmode="decimal" required data-event="paymentAmountChanged" data-on="input" data-bind-value="paymentAmount" /></div>
                  <div class="ef-field"><label class="ef-field__label" for="payment-date">Date received</label>
                    <input id="payment-date" type="date" data-event="paymentDateChanged" data-on="input" data-bind-value="paymentDate" /></div>
                  <div class="ef-field"><label class="ef-field__label" for="payment-method">Method</label>
                    <select id="payment-method" data-event="paymentMethodChanged" data-bind-value="paymentMethod">
                      <option value="ach">ACH</option><option value="check">Check</option><option value="wire">Wire</option><option value="credit-card">Card</option><option value="cash">Cash</option><option value="other">Other</option>
                    </select></div>
                  <div class="ef-field"><label class="ef-field__label" for="payment-reference">Reference</label>
                    <input id="payment-reference" type="text" data-event="paymentReferenceChanged" data-on="input" data-bind-value="paymentReference" /></div>
                </div>
                <div class="ef-actions"><button type="submit" class="ef-button" id="record-payment">Record payment</button></div>
              </form>
            </template>
            <section class="ef-stack" id="invoice-follow-up" aria-labelledby="follow-up-title">
              <h3 id="follow-up-title">Follow-up</h3>
              <p><span id="follow-up-collection" data-text="fuCollection"></span> <span id="follow-up-dispute" data-text="fuDispute"></span></p>
              <template data-if="canRecordPayment">
                <div class="ef-actions"><button type="button" class="ef-button" data-variant="secondary" id="record-reminder" data-event="reminderRecorded">Record a reminder sent</button></div>
              </template>
              <div class="ef-field"><label class="ef-field__label" for="follow-up-note">What the customer disputes, or how it was resolved</label>
                <input id="follow-up-note" type="text" data-event="followUpNoteChanged" data-on="input" data-bind-value="fuNote" /></div>
              <div class="ef-actions">
                <template data-if="fuNotDisputed"><button type="button" class="ef-button" data-variant="secondary" id="mark-disputed" data-event="disputeMarked">Mark disputed</button></template>
                <template data-if="fuDisputed"><button type="button" class="ef-button" data-variant="secondary" id="settle-dispute" data-event="disputeSettled">Resolve the dispute</button></template>
              </div>
            </section>
            <h3 id="credits-title">Credits applied</h3>
            <table class="summa-table" id="invoice-credits">
              <caption class="ef-visually-hidden">Credits applied to this invoice</caption>
              <thead><tr><th scope="col">Applied</th><th scope="col">From</th><th scope="col" class="summa-number">Amount</th></tr></thead>
              <tbody><template data-each="detailCredits" data-key="key"><tr><td data-text="date"></td><td><a class="summa-link" data-bind-href="href" data-text="source"></a></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
            </table>
            <template data-if="canRecordPayment">
              <form class="ef-stack" id="credit-form" data-event="creditMemoIssued" aria-labelledby="credit-form-title">
                <h3 id="credit-form-title">Issue a credit memo</h3>
                <p class="ef-field__description">The invoice stays as issued. A credit memo reduces what is owed, and the customer receives it as its own document.</p>
                <div class="summa-fields">
                  <div class="ef-field"><label class="ef-field__label" for="credit-amount">Amount to credit</label>
                    <input id="credit-amount" type="text" inputmode="decimal" required data-event="creditAmountChanged" data-on="input" data-bind-value="creditAmount" /></div>
                  <div class="ef-field"><label class="ef-field__label" for="credit-reason">Reason, as the customer will read it</label>
                    <input id="credit-reason" type="text" required data-event="creditReasonChanged" data-on="input" data-bind-value="creditReason" /></div>
                </div>
                <div class="ef-actions"><button type="submit" class="ef-button" data-variant="secondary" id="issue-credit">Issue credit memo</button></div>
              </form>
            </template>
          </section>
          </template>

          <template data-if="onHistoryTab">
            <section class="ef-surface ef-stack" aria-labelledby="history-title">
              <h2 id="history-title">History</h2>
              <p>Posted to the books as <a class="summa-link" id="invoice-entry" data-bind-href="detailEntryHref" data-text="detailEntryId"></a>.</p>
              <table class="summa-table" id="invoice-history">
                <caption class="ef-visually-hidden">What happened to this invoice</caption>
                <thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">What</th></tr></thead>
                <tbody><template data-each="history" data-key="key"><tr><td data-text="when"></td><td data-text="who"></td><td data-text="what"></td></tr></template></tbody>
              </table>
            </section>
          </template>
        </section>
      </template>
    </template>

    <!-- Receivables by age, on what is still outstanding (v0.4 §9, v0.2 §20). -->
    <template data-if="onReceivables">
      <section class="ef-stack" aria-labelledby="receivables-title">
        <h1 id="receivables-title">Receivables</h1>
        <div class="summa-filters" role="search" aria-label="Receivables">
          <div class="ef-field"><label class="ef-field__label" for="receivables-as-of">As of</label>
            <input id="receivables-as-of" type="date" data-event="receivablesAsOfChanged" data-on="change" data-bind-value="receivablesAsOf" /></div>
          <div class="ef-field"><label class="ef-field__label" for="receivables-customer">Customer</label>
            <select id="receivables-customer" data-event="receivablesCustomerChosen" data-bind-value="receivablesCustomer">
              <option value="">All customers</option>
              <template data-each="receivablesCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
        </div>
        <p class="summa-count" id="receivables-date">Aged as of <span data-text="receivablesDate"></span>.</p>
        <template data-if="hasAging">
          <table class="summa-table" id="aging-table">
            <caption class="ef-visually-hidden">Receivables by age</caption>
            <thead><tr><th scope="col">Customer</th><th scope="col" class="summa-number">Not yet due</th><th scope="col" class="summa-number">1-30</th><th scope="col" class="summa-number">31-60</th><th scope="col" class="summa-number">61-90</th><th scope="col" class="summa-number">Over 90</th><th scope="col" class="summa-number">Total</th></tr></thead>
            <tbody>
              <template data-each="aging" data-key="key">
                <tr><td data-text="customer"></td><td class="summa-number" data-text="current"></td><td class="summa-number" data-text="days1to30"></td><td class="summa-number" data-text="days31to60"></td><td class="summa-number" data-text="days61to90"></td><td class="summa-number" data-text="over90"></td><td class="summa-number" data-text="total"></td></tr>
              </template>
            </tbody>
          </table>
        </template>
      </section>
    </template>

    <!-- Engagements (v0.2 §16-17). -->
    <template data-if="onEngagements">
      <section class="ef-stack" aria-labelledby="engagements-title">
        <h1 id="engagements-title">Engagements</h1>
        <div class="summa-filters" role="search" aria-label="Engagements">
          <div class="ef-field"><label class="ef-field__label" for="engagements-customer">Customer</label>
            <select id="engagements-customer" data-event="engagementsCustomerChosen" data-bind-value="engagementCustomer">
              <option value="">All customers</option>
              <template data-each="engagementsCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
        </div>
        <template data-if="hasEngagements">
          <table class="summa-table" id="engagements-table">
            <caption class="ef-visually-hidden">Engagements</caption>
            <thead><tr><th scope="col">Engagement</th><th scope="col">Customer</th><th scope="col">Fee</th></tr></thead>
            <tbody><template data-each="engagements" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="name"></a></td><td><a class="summa-link" data-bind-href="customerHref" data-text="customer"></a></td><td data-text="fee"></td></tr></template></tbody>
          </table>
        </template>
        <form class="ef-surface ef-stack" id="engagement-form" data-event="engagementAdded" aria-labelledby="engagement-form-title">
          <h2 id="engagement-form-title">Add an engagement</h2>
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="engagement-customer">Customer</label>
              <select id="engagement-customer" data-event="engagementCustomerChanged" data-bind-value="engagementFormCustomer">
                <option value="">Choose a customer</option>
                <template data-each="engagementFormCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select></div>
            <div class="ef-field"><label class="ef-field__label" for="engagement-name">Name</label>
              <input id="engagement-name" type="text" required data-event="engagementNameChanged" data-on="input" data-bind-value="engagementFormName" /></div>
            <div class="ef-field"><label class="ef-field__label" for="engagement-fee">Fixed fee</label>
              <input id="engagement-fee" type="text" inputmode="decimal" aria-describedby="engagement-fee-note" data-event="engagementFeeChanged" data-on="input" data-bind-value="engagementFormFee" />
              <p class="ef-field__description" id="engagement-fee-note">Leave empty for hourly work.</p></div>
          </div>
          <div class="ef-actions"><button type="submit" class="ef-button" id="add-engagement">Add engagement</button></div>
        </form>
      </section>
    </template>

    <template data-if="onEngagement">
      <section class="ef-stack" aria-labelledby="engagement-title">
        <h1 id="engagement-title" data-text="engName"></h1>
        <dl class="summa-facts">
          <div><dt>Customer</dt><dd><a class="summa-link" data-bind-href="engCustomerHref" data-text="engCustomer"></a></dd></div>
          <div><dt>Fee</dt><dd id="engagement-fee-text" data-text="engFee"></dd></div>
          <div><dt>Terms</dt><dd data-text="engTerms"></dd></div>
        </dl>
        <p><a class="summa-link" data-bind-href="engNewInvoiceHref">New invoice for this customer</a></p>
        <template data-if="engHasMilestones">
          <table class="summa-table" id="engagement-milestones">
            <caption>Milestones</caption>
            <thead><tr><th scope="col">Milestone</th><th scope="col">State</th><th scope="col" class="summa-number">Amount</th></tr></thead>
            <tbody><template data-each="engMilestones" data-key="key"><tr><td data-text="label"></td><td data-text="state"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
          </table>
        </template>
        <table class="summa-table" id="engagement-invoices">
          <caption>Invoices</caption>
          <thead><tr><th scope="col">Invoice</th><th scope="col">Issued</th><th scope="col" class="summa-number">Total</th></tr></thead>
          <tbody><template data-each="engInvoices" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="number"></a></td><td data-text="issueDate"></td><td class="summa-number" data-text="total"></td></tr></template></tbody>
        </table>
      </section>
    </template>

    <!-- One customer and their invoices, payments and credits (v0.4 §3). -->
    <template data-if="onCustomer">
      <section class="ef-stack" aria-labelledby="customer-title">
        <h1 id="customer-title" data-text="custName"></h1>
        <dl class="summa-facts">
          <div><dt>Billed as</dt><dd data-text="custBillingName"></dd></div>
          <div><dt>Billing email</dt><dd data-text="custEmail"></dd></div>
          <div><dt>Terms</dt><dd data-text="custTerms"></dd></div>
          <div><dt>Open balance</dt><dd id="customer-balance" data-text="custBalance"></dd></div>
          <div><dt>Credit available</dt><dd id="customer-credit" data-text="custCredit"></dd></div>
          <div><dt>Status</dt><dd data-text="custStatus"></dd></div>
        </dl>
        <p class="summa-pre" data-text="custAddress"></p>
        <p><a class="summa-link" id="customer-new-invoice" data-bind-href="custNewInvoiceHref">New invoice for this customer</a></p>
        <div class="summa-tabs" role="group" aria-label="Customer views">
          <template data-each="customerTabs" data-key="value">
            <button type="button" class="summa-tab" data-event="customerTabChosen" data-bind-aria-pressed="selected" data-bind-data-tab="value" data-text="label"></button>
          </template>
        </div>
        <template data-if="onCustInvoicesTab">
          <table class="summa-table" id="customer-invoices">
            <caption class="ef-visually-hidden">Invoices</caption>
            <thead><tr><th scope="col">Invoice</th><th scope="col">Issued</th><th scope="col">Status</th><th scope="col" class="summa-number">Outstanding</th></tr></thead>
            <tbody><template data-each="custInvoices" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="number"></a></td><td data-text="issueDate"></td><td data-text="status"></td><td class="summa-number" data-text="outstanding"></td></tr></template></tbody>
          </table>
        </template>
        <template data-if="onCustPaymentsTab">
          <table class="summa-table" id="customer-payments">
            <caption class="ef-visually-hidden">Payments</caption>
            <thead><tr><th scope="col">Payment</th><th scope="col">Received</th><th scope="col">Reference</th><th scope="col" class="summa-number">Amount</th></tr></thead>
            <tbody><template data-each="custPayments" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="date"></td><td data-text="reference"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
          </table>
        </template>
        <template data-if="onCustCreditsTab">
          <table class="summa-table" id="customer-credits">
            <caption class="ef-visually-hidden">Credit memos</caption>
            <thead><tr><th scope="col">Credit memo</th><th scope="col">Issued</th><th scope="col">Reason</th><th scope="col" class="summa-number">Amount</th><th scope="col" class="summa-number">Unused</th></tr></thead>
            <tbody><template data-each="custCredits" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="date"></td><td data-text="reason"></td><td class="summa-number" data-text="amount"></td><td class="summa-number" data-text="remaining"></td></tr></template></tbody>
          </table>
        </template>
      </section>
    </template>

    <!-- Payments received (v0.4 §11, §13). -->
    <template data-if="onPayments">
      <section class="ef-stack" aria-labelledby="payments-list-title">
        <h1 id="payments-list-title">Payments</h1>
        <template data-if="hasPayments">
          <div class="ef-stack" id="payment-list">
            <div class="summa-filters" role="search" aria-label="Payments">
              <div class="ef-field"><label class="ef-field__label" for="payment-search">Search reference or customer</label>
                <input id="payment-search" type="search" data-event="paymentSearchChanged" data-on="input" data-bind-value="paymentSearch" /></div>
              <div class="ef-field"><label class="ef-field__label" for="payment-customer">Customer</label>
                <select id="payment-customer" data-event="paymentCustomerChosen" data-bind-value="paymentCustomer">
                  <option value="">All customers</option>
                  <template data-each="paymentCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
                </select></div>
              <div class="ef-field"><label class="ef-field__label" for="payment-from">Received from</label>
                <input id="payment-from" type="date" data-event="paymentFromChanged" data-on="change" data-bind-value="paymentFrom" /></div>
              <div class="ef-field"><label class="ef-field__label" for="payment-to">Received to</label>
                <input id="payment-to" type="date" data-event="paymentToChanged" data-on="change" data-bind-value="paymentTo" /></div>
              <div class="ef-field"><label class="ef-field__label" for="payment-sort">Sort by</label>
                <select id="payment-sort" data-event="paymentSortChosen" data-bind-value="paymentSort">
                  <option value="newest">Newest first</option><option value="oldest">Oldest first</option>
                </select></div>
              <label class="summa-check"><input id="payment-unapplied" type="checkbox" data-event="paymentUnappliedToggled" data-on="change" data-bind-checked="paymentUnapplied" /> Not fully applied</label>
              <template data-if="isPaymentFiltered"><button type="button" class="ef-button" data-variant="secondary" id="clear-payment-filters" data-event="paymentFiltersCleared">Clear filters</button></template>
            </div>
            <p class="summa-count" id="payment-count-text" role="status" data-text="paymentCountText"></p>
            <template data-if="noListedPayments"><p id="no-payments">No payment matches these filters.</p></template>
            <table class="summa-table" id="payments-table">
              <caption class="ef-visually-hidden">Payments received</caption>
              <thead><tr><th scope="col">Payment</th><th scope="col">Received</th><th scope="col">Customer</th><th scope="col">Method</th><th scope="col">Reference</th><th scope="col" class="summa-number">Amount</th><th scope="col" class="summa-number">Not applied</th></tr></thead>
              <tbody><template data-each="payments" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="date"></td><td><a class="summa-link" data-bind-href="customerHref" data-text="customer"></a></td><td data-text="method"></td><td data-text="reference"></td><td class="summa-number" data-text="amount"></td><td class="summa-number" data-text="unapplied"></td></tr></template></tbody>
            </table>
          </div>
        </template>
      </section>
    </template>

    <template data-if="onPayment">
      <section class="ef-stack" aria-labelledby="payment-title">
        <h1 id="payment-title">Payment <span data-text="payId"></span></h1>
        <template data-if="payReversed"><p class="summa-error" role="note">This payment was reversed.</p></template>
        <dl class="summa-facts">
          <div><dt>Received</dt><dd data-text="payDate"></dd></div>
          <div><dt>Customer</dt><dd><a class="summa-link" data-bind-href="payCustomerHref" data-text="payCustomer"></a></dd></div>
          <div><dt>Method</dt><dd data-text="payMethod"></dd></div>
          <div><dt>Reference</dt><dd data-text="payReference"></dd></div>
          <div><dt>Amount</dt><dd id="payment-amount-text" data-text="payAmount"></dd></div>
          <div><dt>Not applied</dt><dd id="payment-unapplied-text" data-text="payUnapplied"></dd></div>
        </dl>
        <table class="summa-table" id="payment-allocations">
          <caption>Applied to</caption>
          <thead><tr><th scope="col">Invoice</th><th scope="col" class="summa-number">Amount</th></tr></thead>
          <tbody><template data-each="payAllocations" data-key="key"><tr><td><a class="summa-link" data-bind-href="href" data-text="invoice"></a></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
        </table>
      </section>
    </template>

    <!-- Credit memos (v0.2 §6, INV-COR-008). -->
    <template data-if="onCreditMemos">
      <section class="ef-stack" aria-labelledby="credit-memos-title">
        <h1 id="credit-memos-title">Credit memos</h1>
        <div class="summa-filters" role="search" aria-label="Credit memos">
          <div class="ef-field"><label class="ef-field__label" for="credit-memos-customer">Customer</label>
            <select id="credit-memos-customer" data-event="creditMemosCustomerChosen" data-bind-value="memoCustomer">
              <option value="">All customers</option>
              <template data-each="memoCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
        </div>
        <template data-if="hasCreditMemos">
          <table class="summa-table" id="credit-memos-table">
            <caption class="ef-visually-hidden">Credit memos</caption>
            <thead><tr><th scope="col">Credit memo</th><th scope="col">Issued</th><th scope="col">Customer</th><th scope="col">Invoice</th><th scope="col" class="summa-number">Amount</th><th scope="col" class="summa-number">Unused</th></tr></thead>
            <tbody><template data-each="creditMemos" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="date"></td><td><a class="summa-link" data-bind-href="customerHref" data-text="customer"></a></td><td><a class="summa-link" data-bind-href="invoiceHref" data-text="invoice"></a></td><td class="summa-number" data-text="amount"></td><td class="summa-number" data-text="remaining"></td></tr></template></tbody>
          </table>
        </template>
        <p>A credit memo is issued from the invoice it corrects, on its Payments tab.</p>
      </section>
    </template>

    <template data-if="onCreditMemo">
      <section class="ef-stack" aria-labelledby="credit-memo-title">
        <div class="summa-invoice-head">
          <h1 id="credit-memo-title">Credit memo <span data-text="cmId"></span></h1>
          <p>Credits <a class="summa-link" id="credit-memo-invoice" data-bind-href="cmInvoiceHref" data-text="cmInvoice"></a> · Unused <strong id="credit-memo-remaining" data-text="cmRemaining"></strong></p>
          <template data-if="canPrint"><p class="summa-screen-only"><button type="button" class="ef-button" data-variant="secondary" id="print-credit-memo" data-event="printRequested">Print or save as PDF</button></p></template>
        </div>
        <template data-if="cmHasDocument">
          <ef-print-document class="summa-document" id="credit-memo-document">
            <ef-print-header repeat="page"><span slot="left" data-text="cmIssuer"></span><span slot="right">Credit memo <span data-text="cmId"></span></span></ef-print-header>
            <header class="summa-document__head">
              <div><p class="summa-document__issuer" data-text="cmIssuer"></p><p class="summa-pre" data-text="cmIssuerAddress"></p></div>
              <dl class="summa-document__facts">
                <div><dt>Credit memo</dt><dd data-text="cmId"></dd></div>
                <div><dt>Issue date</dt><dd data-text="cmIssueDate"></dd></div>
                <div><dt>Credits invoice</dt><dd><span data-text="cmInvoice"></span>, issued <span data-text="cmInvoiceDate"></span></dd></div>
              </dl>
            </header>
            <section aria-label="Credit to"><h2 class="summa-document__label">Credit to</h2><p data-text="cmCustomer"></p><p class="summa-pre" data-text="cmCustomerAddress"></p></section>
            <section aria-label="Reason"><h2 class="summa-document__label">Reason</h2><p class="summa-pre" id="credit-memo-reason" data-text="cmReason"></p></section>
            <template data-if="cmHasLines">
              <ef-print-table><table class="summa-table" id="credit-memo-lines">
                <caption>Credited lines</caption>
                <thead><tr><th scope="col">Description</th><th scope="col" class="summa-number">Quantity</th><th scope="col" class="summa-number">Charged</th></tr></thead>
                <tbody><template data-each="cmLines" data-key="key"><tr><td data-text="description"></td><td class="summa-number" data-text="quantity"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
              </table></ef-print-table>
            </template>
            <ef-print-keep><dl class="summa-document__totals"><div class="summa-document__due"><dt>Amount credited</dt><dd id="credit-memo-amount" data-text="cmAmount"></dd></div></dl></ef-print-keep>
            <ef-print-footer repeat="page"><span slot="right"><ef-print-page-number format="page-of-pages"></ef-print-page-number></span></ef-print-footer>
          </ef-print-document>
        </template>
        <template data-if="cmNoDocument"><p>This credit memo was not raised against an invoice, so it has no customer document. It credited <span data-text="cmAmount"></span>: <span data-text="cmReason"></span>.</p></template>
        <table class="summa-table summa-screen-only" id="credit-memo-applications">
          <caption>Applied to</caption>
          <thead><tr><th scope="col">Invoice</th><th scope="col">Applied</th><th scope="col" class="summa-number">Amount</th></tr></thead>
          <tbody><template data-each="cmApplications" data-key="key"><tr><td><a class="summa-link" data-bind-href="href" data-text="invoice"></a></td><td data-text="date"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
        </table>
      </section>
    </template>

    <!-- The general ledger: the journal, or one account with a running balance (v0.4 §20-21). -->
    <template data-if="onLedger">
      <section class="ef-stack" aria-labelledby="ledger-title">
        <h1 id="ledger-title">Ledger</h1>
        <div class="summa-filters" role="search" aria-label="Ledger">
          <div class="ef-field"><label class="ef-field__label" for="ledger-account">Account</label>
            <select id="ledger-account" data-event="ledgerAccountChosen" data-bind-value="ledgerAccount">
              <option value="">All entries (journal)</option>
              <template data-each="ledgerAccountOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
          <div class="ef-field"><label class="ef-field__label" for="ledger-from">From</label>
            <input id="ledger-from" type="date" data-event="ledgerFromChanged" data-on="change" data-bind-value="ledgerFrom" /></div>
          <div class="ef-field"><label class="ef-field__label" for="ledger-to">To</label>
            <input id="ledger-to" type="date" data-event="ledgerToChanged" data-on="change" data-bind-value="ledgerTo" /></div>
        </div>
        <template data-if="isAccountLedger">
          <div class="ef-stack" id="account-ledger">
            <h2 id="ledger-account-name" data-text="ledgerAccountName"></h2>
            <template data-if="hasLedgerOpening"><p class="summa-count">Balance brought forward <strong id="ledger-opening" data-text="ledgerOpening"></strong></p></template>
            <table class="summa-table" id="ledger-table">
              <caption class="ef-visually-hidden">Entries to this account</caption>
              <thead><tr><th scope="col">Date</th><th scope="col">Entry</th><th scope="col">Description</th><th scope="col" class="summa-number">Debit</th><th scope="col" class="summa-number">Credit</th><th scope="col" class="summa-number">Balance</th></tr></thead>
              <tbody><template data-each="ledgerRows" data-key="key"><tr><td data-text="date"></td><td><a class="summa-link" data-bind-href="href" data-text="entry"></a></td><td data-text="description"></td><td class="summa-number" data-text="debit"></td><td class="summa-number" data-text="credit"></td><td class="summa-number" data-text="balance"></td></tr></template></tbody>
            </table>
          </div>
        </template>
        <template data-if="isJournal">
          <table class="summa-table" id="journal-table">
            <caption class="ef-visually-hidden">Journal entries</caption>
            <thead><tr><th scope="col">Date</th><th scope="col">Entry</th><th scope="col">Description</th><th scope="col" class="summa-number">Amount</th></tr></thead>
            <tbody><template data-each="journalRows" data-key="key"><tr><td data-text="date"></td><td><a class="summa-link" data-bind-href="href" data-text="entry"></a></td><td data-text="description"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
          </table>
        </template>
      </section>
    </template>

    <template data-if="onJournalEntry">
      <section class="ef-stack" aria-labelledby="entry-title">
        <h1 id="entry-title">Journal entry <span data-text="entryId"></span></h1>
        <dl class="summa-facts">
          <div><dt>Date</dt><dd data-text="entryDate"></dd></div>
          <div><dt>Description</dt><dd data-text="entryDescription"></dd></div>
          <div><dt>Source</dt><dd data-text="entrySource"></dd></div>
          <div><dt>Posted</dt><dd data-text="entryPostedAt"></dd></div>
        </dl>
        <template data-if="hasEntryOrigin"><p>Posted by <a class="summa-link" id="entry-origin" data-bind-href="entryOriginHref" data-text="entryOrigin"></a></p></template>
        <template data-if="entryReverses"><p>Reverses <a class="summa-link" data-bind-href="entryReversesHref" data-text="entryReversesId"></a></p></template>
        <table class="summa-table" id="entry-lines">
          <caption>Lines</caption>
          <thead><tr><th scope="col">Account</th><th scope="col">Memo</th><th scope="col" class="summa-number">Debit</th><th scope="col" class="summa-number">Credit</th></tr></thead>
          <tbody><template data-each="entryLines" data-key="key"><tr><td><a class="summa-link" data-bind-href="href" data-text="account"></a></td><td data-text="memo"></td><td class="summa-number" data-text="debit"></td><td class="summa-number" data-text="credit"></td></tr></template></tbody>
          <tfoot><tr><th scope="row" colspan="2">Totals</th><td class="summa-number" id="entry-debits" data-text="entryDebits"></td><td class="summa-number" id="entry-credits" data-text="entryCredits"></td></tr></tfoot>
        </table>
      </section>
    </template>

    <!-- Reports (v0.1 §15, v0.2 §24, v0.4 §23). -->
    <template data-if="onReports">
      <section class="ef-stack" aria-labelledby="reports-title">
        <h1 id="reports-title">Reports</h1>
        <ul class="summa-report-list">
          <li><a class="summa-link" id="trial-balance-link" data-bind-href="trialBalanceHref">Trial balance</a></li>
          <li><a class="summa-link" id="income-statement-link" data-bind-href="incomeStatementHref">Income statement</a></li>
          <li><a class="summa-link" id="balance-sheet-link" data-bind-href="balanceSheetHref">Balance sheet</a></li>
        </ul>
      </section>
    </template>

    <template data-if="onTrialBalance">
      <section class="ef-stack" aria-labelledby="trial-balance-title">
        <h1 id="trial-balance-title">Trial balance</h1>
        <div class="summa-filters" role="search" aria-label="Trial balance">
          <div class="ef-field"><label class="ef-field__label" for="trial-as-of">As of</label>
            <input id="trial-as-of" type="date" data-event="reportAsOfChanged" data-on="change" data-bind-value="reportAsOf" /></div>
        </div>
        <p class="summa-count">As of <span data-text="reportDate"></span>.</p>
        <table class="summa-table" id="trial-balance-table">
          <caption class="ef-visually-hidden">Trial balance</caption>
          <thead><tr><th scope="col">Code</th><th scope="col">Account</th><th scope="col" class="summa-number">Debit</th><th scope="col" class="summa-number">Credit</th></tr></thead>
          <tbody><template data-each="trialRows" data-key="key"><tr><td data-text="code"></td><td><a class="summa-link" data-bind-href="href" data-text="name"></a></td><td class="summa-number" data-text="debit"></td><td class="summa-number" data-text="credit"></td></tr></template></tbody>
          <tfoot><tr><th scope="row" colspan="2">Totals</th><td class="summa-number" id="trial-debits" data-text="trialDebits"></td><td class="summa-number" id="trial-credits" data-text="trialCredits"></td></tr></tfoot>
        </table>
        <template data-if="trialBalances"><p class="summa-notice" id="trial-balances">Debits equal credits.</p></template>
      </section>
    </template>

    <template data-if="onIncomeStatement">
      <section class="ef-stack" aria-labelledby="income-title">
        <h1 id="income-title">Income statement</h1>
        <div class="summa-filters" role="search" aria-label="Income statement">
          <div class="ef-field"><label class="ef-field__label" for="income-from">From</label>
            <input id="income-from" type="date" data-event="incomeFromChanged" data-on="change" data-bind-value="incomeFrom" /></div>
          <div class="ef-field"><label class="ef-field__label" for="income-to">To</label>
            <input id="income-to" type="date" data-event="incomeToChanged" data-on="change" data-bind-value="incomeTo" /></div>
          <div class="ef-field"><label class="ef-field__label" for="income-basis">Basis</label>
            <select id="income-basis" data-event="incomeBasisChosen" data-bind-value="incomeBasis">
              <option value="accrual">Accrual</option><option value="cash">Cash</option>
            </select></div>
        </div>
        <div class="summa-tabs" role="group" aria-label="Date ranges">
          <template data-each="incomeRanges" data-key="value">
            <button type="button" class="summa-tab" data-event="incomeRangeChosen" data-bind-aria-pressed="selected" data-bind-data-range="value" data-text="label"></button>
          </template>
        </div>
        <p class="summa-count"><span id="income-basis-label" data-text="incomeBasisLabel"></span>, <span data-text="incomePeriod"></span>.</p>
        <dl class="summa-facts" id="income-figures">
          <div><dt>Revenue</dt><dd id="income-revenue" data-text="incomeRevenue"></dd></div>
          <div><dt>Expenses</dt><dd id="income-expenses" data-text="incomeExpenses"></dd></div>
          <div><dt>Net income</dt><dd id="income-net" data-text="incomeNet"></dd></div>
        </dl>
        <table class="summa-table" id="income-accounts">
          <caption>By account</caption>
          <thead><tr><th scope="col">Account</th><th scope="col">Kind</th><th scope="col" class="summa-number">Amount</th></tr></thead>
          <tbody><template data-each="incomeAccounts" data-key="key"><tr><td><a class="summa-link" data-bind-href="href" data-text="account"></a></td><td data-text="kind"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
        </table>
      </section>
    </template>

    <template data-if="onBalanceSheet">
      <section class="ef-stack" aria-labelledby="balance-sheet-title">
        <h1 id="balance-sheet-title">Balance sheet</h1>
        <div class="summa-filters" role="search" aria-label="Balance sheet">
          <div class="ef-field"><label class="ef-field__label" for="sheet-as-of">As of</label>
            <input id="sheet-as-of" type="date" data-event="reportAsOfChanged" data-on="change" data-bind-value="reportAsOf" /></div>
        </div>
        <p class="summa-count">As of <span data-text="reportDate"></span>.</p>
        <dl class="summa-facts" id="balance-sheet-figures">
          <div><dt>Assets</dt><dd id="sheet-assets" data-text="sheetAssets"></dd></div>
          <div><dt>Liabilities</dt><dd id="sheet-liabilities" data-text="sheetLiabilities"></dd></div>
          <div><dt>Equity</dt><dd id="sheet-equity" data-text="sheetEquity"></dd></div>
          <div><dt>Current earnings</dt><dd id="sheet-earnings" data-text="sheetEarnings"></dd></div>
        </dl>
        <template data-if="sheetBalances"><p class="summa-notice" id="sheet-balances">Assets equal liabilities plus equity.</p></template>
      </section>
    </template>

    <!-- Accounting periods and closing them (v0.1 §2, v0.4 period close). -->
    <template data-if="onPeriods">
      <section class="ef-stack" aria-labelledby="periods-title">
        <h1 id="periods-title">Periods <span data-text="periodsYear"></span></h1>
        <p><a class="summa-link" id="previous-year" data-bind-href="previousYearHref">Previous year</a> · <a class="summa-link" id="next-year" data-bind-href="nextYearHref">Next year</a></p>
        <table class="summa-table" id="periods-table">
          <caption class="ef-visually-hidden">Months</caption>
          <thead><tr><th scope="col">Month</th><th scope="col">State</th><th scope="col" class="summa-number">Entries</th></tr></thead>
          <tbody><template data-each="months" data-key="key"><tr><td><a class="summa-link" data-bind-href="href" data-text="label"></a></td><td data-text="state"></td><td class="summa-number" data-text="entries"></td></tr></template></tbody>
        </table>
      </section>
    </template>

    <template data-if="onPeriod">
      <section class="ef-stack" aria-labelledby="period-title">
        <h1 id="period-title" data-text="periodLabel"></h1>
        <p>State: <strong id="period-state" data-text="periodState"></strong> · <a class="summa-link" data-bind-href="periodYearHref">All months</a></p>
        <ul class="summa-checks" id="period-checks">
          <template data-each="periodChecks" data-key="key"><li data-bind-data-tone="tone"><span data-text="label"></span>: <strong data-text="result"></strong></li></template>
        </ul>
        <template data-if="isPeriodBlocked">
          <div class="summa-blockers" id="period-blockers" role="note">
            <h2>Not ready to close</h2>
            <ul><template data-each="periodBlockers" data-key="key"><li data-text="blocker"></li></template></ul>
          </div>
        </template>
        <div class="ef-actions">
          <template data-if="canClosePeriod"><button type="button" class="ef-button" id="close-period" data-event="periodClosed">Close period</button></template>
          <template data-if="canLockPeriod"><button type="button" class="ef-button" data-variant="secondary" id="lock-period" data-event="periodLocked">Lock period</button></template>
          <template data-if="canReopenPeriod"><button type="button" class="ef-button" data-variant="danger" id="reopen-period" data-event="periodReopened">Reopen period</button></template>
        </div>
        <table class="summa-table" id="period-entries">
          <caption>Entries</caption>
          <thead><tr><th scope="col">Date</th><th scope="col">Entry</th><th scope="col">Description</th><th scope="col" class="summa-number">Amount</th></tr></thead>
          <tbody><template data-each="periodEntries" data-key="key"><tr><td data-text="date"></td><td><a class="summa-link" data-bind-href="href" data-text="entry"></a></td><td data-text="description"></td><td class="summa-number" data-text="amount"></td></tr></template></tbody>
        </table>
      </section>
    </template>

    <!-- Everything that needs attention, in one list (v0.4 §31). -->
    <template data-if="onWork">
      <section class="ef-stack" aria-labelledby="work-title">
        <h1 id="work-title">Work</h1>
        <p><a class="summa-link" id="work-follow-up" data-bind-href="followUpHref">Follow-up</a> · <a class="summa-link" id="work-inbox" data-bind-href="inboxHref">Payments inbox</a> · <a class="summa-link" id="work-cpa" data-bind-href="cpaHref">CPA workspace</a></p>
        <template data-if="noWork"><p id="no-work">Nothing needs attention.</p></template>
        <template data-if="hasWork">
          <ul class="summa-work" id="work-list">
            <template data-each="workItems" data-key="key"><li><span class="ef-status-lozenge" data-text="kind"></span> <a class="summa-link" data-bind-href="href" data-text="text"></a></li></template>
          </ul>
        </template>
      </section>
    </template>

    <!-- Overdue and disputed invoices (v0.4 §14-17). -->
    <template data-if="onFollowUp">
      <section class="ef-stack" aria-labelledby="follow-up-list-title">
        <h1 id="follow-up-list-title">Follow-up</h1>
        <div class="summa-tabs" role="group" aria-label="Which invoices">
          <template data-each="followUpTabs" data-key="value">
            <button type="button" class="summa-tab" data-event="followUpShowChosen" data-bind-aria-pressed="selected" data-bind-data-tab="value" data-text="label"></button>
          </template>
        </div>
        <template data-if="noFollowRows"><p id="no-follow-up">No invoice here.</p></template>
        <template data-if="hasFollowRows">
          <table class="summa-table" id="follow-up-table">
            <caption class="ef-visually-hidden">Invoices to follow up</caption>
            <thead><tr><th scope="col">Invoice</th><th scope="col">Customer</th><th scope="col">Due</th><th scope="col">Late</th><th scope="col">Follow-up</th><th scope="col" class="summa-number">Outstanding</th><th scope="col"><span class="ef-visually-hidden">Actions</span></th></tr></thead>
            <tbody><template data-each="followRows" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="number"></a></td><td data-text="customer"></td><td data-text="dueDate"></td><td data-text="late"></td><td><span data-text="collection"></span> <span data-text="dispute"></span></td><td class="summa-number" data-text="outstanding"></td><td><button type="button" class="ef-button summa-remind" data-variant="secondary" data-event="reminderRecorded">Reminder sent</button></td></tr></template></tbody>
          </table>
        </template>
      </section>
    </template>

    <!-- Payments not fully applied (v0.4 §13). -->
    <template data-if="onInbox">
      <section class="ef-stack" aria-labelledby="inbox-title">
        <h1 id="inbox-title">Payments inbox</h1>
        <div class="summa-filters" role="search" aria-label="Payments inbox">
          <div class="ef-field"><label class="ef-field__label" for="inbox-customer">Customer</label>
            <select id="inbox-customer" data-event="inboxCustomerChosen" data-bind-value="inboxCustomer">
              <option value="">All customers</option>
              <template data-each="inboxCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
            </select></div>
        </div>
        <template data-if="noInboxRows"><p id="inbox-empty">Every payment is applied.</p></template>
        <template data-if="hasInboxRows">
          <table class="summa-table" id="inbox-table">
            <caption class="ef-visually-hidden">Payments not fully applied</caption>
            <thead><tr><th scope="col">Payment</th><th scope="col">Received</th><th scope="col">Customer</th><th scope="col">Reference</th><th scope="col" class="summa-number">Not applied</th><th scope="col">Open invoices</th><th scope="col"><span class="ef-visually-hidden">Actions</span></th></tr></thead>
            <tbody><template data-each="inboxRows" data-key="id"><tr><td><a class="summa-link" data-bind-href="href" data-text="id"></a></td><td data-text="date"></td><td data-text="customer"></td><td data-text="reference"></td><td class="summa-number" data-text="unapplied"></td><td data-text="openInvoices"></td><td class="summa-row-actions"><button type="button" class="ef-button summa-apply" data-event="inboxApplied" data-bind-disabled="noApply">Apply to oldest invoices</button> <button type="button" class="ef-button summa-credit" data-variant="secondary" data-event="inboxCredited">Keep as credit</button></td></tr></template></tbody>
          </table>
        </template>
        <form class="ef-surface ef-stack" id="receipt-form" data-event="receiptRecorded" aria-labelledby="receipt-title">
          <h2 id="receipt-title">Record a payment received</h2>
          <div class="summa-fields">
            <div class="ef-field"><label class="ef-field__label" for="receipt-customer">From</label>
              <select id="receipt-customer" data-event="receiptCustomerChanged" data-bind-value="receiptCustomer">
                <option value="">Choose a customer</option>
                <template data-each="receiptCustomerOptions" data-key="value"><option data-bind-value="value" data-bind-selected="selected" data-text="label"></option></template>
              </select></div>
            <div class="ef-field"><label class="ef-field__label" for="receipt-amount">Amount</label>
              <input id="receipt-amount" type="text" inputmode="decimal" required data-event="receiptAmountChanged" data-on="input" data-bind-value="receiptAmount" /></div>
            <div class="ef-field"><label class="ef-field__label" for="receipt-date">Received</label>
              <input id="receipt-date" type="date" data-event="receiptDateChanged" data-on="input" data-bind-value="receiptDate" /></div>
            <div class="ef-field"><label class="ef-field__label" for="receipt-method">Method</label>
              <select id="receipt-method" data-event="receiptMethodChanged" data-bind-value="receiptMethod">
                <option value="ach">ACH</option><option value="check">Check</option><option value="wire">Wire</option><option value="credit-card">Card</option><option value="cash">Cash</option><option value="other">Other</option>
              </select></div>
            <div class="ef-field"><label class="ef-field__label" for="receipt-reference">Reference</label>
              <input id="receipt-reference" type="text" data-event="receiptReferenceChanged" data-on="input" data-bind-value="receiptReference" /></div>
          </div>
          <div class="ef-actions"><button type="submit" class="ef-button" id="record-receipt">Record payment</button></div>
        </form>
      </section>
    </template>

    <!-- The CPA workspace for a year (v0.4 §27-28). -->
    <template data-if="onCpa">
      <section class="ef-stack" aria-labelledby="cpa-title">
        <h1 id="cpa-title">CPA workspace <span data-text="cpaYear"></span></h1>
        <p><a class="summa-link" id="cpa-previous" data-bind-href="cpaPreviousHref">Previous year</a> · <a class="summa-link" id="cpa-next" data-bind-href="cpaNextHref">Next year</a> · <span id="cpa-closed" data-text="cpaClosedMonths"></span></p>
        <ul class="summa-report-list">
          <li><a class="summa-link" id="cpa-trial" data-bind-href="cpaTrialHref">Trial balance at year end</a></li>
          <li><a class="summa-link" id="cpa-income" data-bind-href="cpaIncomeHref">Income statement, accrual</a> · <a class="summa-link" data-bind-href="cpaCashIncomeHref">cash</a></li>
          <li><a class="summa-link" id="cpa-sheet" data-bind-href="cpaSheetHref">Balance sheet at year end</a></li>
          <li><a class="summa-link" id="cpa-ledger" data-bind-href="cpaLedgerHref">Journal for the year</a></li>
          <li><a class="summa-link" id="cpa-aging" data-bind-href="cpaAgingHref">Receivables aged at year end</a></li>
          <li><a class="summa-link" id="cpa-periods" data-bind-href="cpaPeriodsHref">Periods</a></li>
        </ul>
        <template data-if="canExport">
          <div class="ef-actions">
            <button type="button" class="ef-button" data-variant="secondary" id="export-trial-balance" data-event="cpaTrialBalanceExported">Download trial balance (CSV)</button>
            <button type="button" class="ef-button" data-variant="secondary" id="export-journal" data-event="cpaJournalExported">Download journal (CSV)</button>
          </div>
        </template>
        <template data-if="hasCpaAdjustments">
          <table class="summa-table" id="cpa-adjustments">
            <caption>Adjusting, opening and closing entries</caption>
            <thead><tr><th scope="col">Date</th><th scope="col">Entry</th><th scope="col">Kind</th><th scope="col">Description</th></tr></thead>
            <tbody><template data-each="cpaAdjustments" data-key="key"><tr><td data-text="date"></td><td><a class="summa-link" data-bind-href="href" data-text="key"></a></td><td data-text="kind"></td><td data-text="description"></td></tr></template></tbody>
          </table>
        </template>
      </section>
    </template>

    <!-- The issuer shown on new invoices. -->
    <template data-if="onSettings">
      <section class="ef-stack" aria-labelledby="settings-title">
        <h1 id="settings-title">Settings</h1>
        <form class="ef-surface ef-stack" id="company-form" data-event="companySaved" aria-labelledby="company-title">
          <h2 id="company-title">Company on invoices</h2>
          <div class="ef-field"><label class="ef-field__label" for="company-legal-name">Legal name</label>
            <input id="company-legal-name" type="text" required data-event="companyLegalNameChanged" data-on="input" data-bind-value="companyLegalName" /></div>
          <div class="ef-field"><label class="ef-field__label" for="company-address">Address</label>
            <textarea id="company-address" rows="3" data-event="companyAddressChanged" data-on="input" data-bind-value="companyAddress"></textarea></div>
          <div class="ef-field"><label class="ef-field__label" for="company-email">Billing email</label>
            <input id="company-email" type="email" data-event="companyEmailChanged" data-on="input" data-bind-value="companyEmail" /></div>
          <div class="ef-field"><label class="ef-field__label" for="company-payment">Payment instructions</label>
            <textarea id="company-payment" rows="3" aria-describedby="company-payment-note" data-event="companyPaymentChanged" data-on="input" data-bind-value="companyPayment"></textarea>
            <p class="ef-field__description" id="company-payment-note">Printed on invoices. Show masked account numbers only, never a full account number.</p></div>
          <div class="ef-actions"><button type="submit" class="ef-button" id="save-company">Save</button></div>
        </form>
      </section>
    </template>
  </main>
</div>
</template>

<script type="module" src="./app.js"></script>
</body>
</html>
