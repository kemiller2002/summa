name: Contracts release

# Releases EchelonFoundry.Summa.Contracts, the Chrona-to-Summa contract
# (DF-SUMMA-2026-0001, WI-0017), with the Echelon `nuget-library` release
# pattern Arca and Fides use (echelon-registry
# spec/ecosystem-release-workflow-requirements.md):
#
#   - the package is built, tested and packed once; checksums.txt holds the
#     SHA-256 of the exact bytes that ship;
#   - echelon-release.json, the echelon.release/v2 manifest for system
#     `summa-contracts`, is generated by the Registry's release-contract action
#     from those bytes and validated against the Registry schema;
#   - the same assets go to an immutable GitHub release, tag
#     `contracts-v<version>`, with build-provenance (Sigstore) attestations
#     verified after upload. Consumers install them through Conditor's local
#     feed (vendor/nuget) once the Registry records the release; the package
#     is not on nuget.org.
#
# The version source is <Version> in src/Summa.Contracts/Summa.Contracts.fsproj.
# A push to main that changes it publishes `contracts-v<version>`; a dispatch
# from main publishes the current version if it is not out yet. A published
# version is never replaced. Pull requests run everything but publication.

on:
  pull_request:
    paths:
      - ".github/workflows/contracts-release.yml"
      - "release/summa-contracts.release-input.json"
      - "src/Summa.Contracts/**"
      - "tests/Summa.Contracts.Tests/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
  push:
    branches: [main]
    paths:
      - ".github/workflows/contracts-release.yml"
      - "release/summa-contracts.release-input.json"
      - "src/Summa.Contracts/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: summa-contracts-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PROJECT: src/Summa.Contracts/Summa.Contracts.fsproj
  TESTS: tests/Summa.Contracts.Tests/Summa.Contracts.Tests.fsproj
  # The Registry commit whose release-contract action and schema this uses.
  ECHELON_REGISTRY_REF: e9b8cf7cbdbf54cc475b63643af9318bbd2fd9e4

jobs:
  version:
    name: Resolve the release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        shell: bash
        run: |
          set -euo pipefail
          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' "$PROJECT")
          if ! [[ "$declared" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$PROJECT declares '$declared', not an X.Y.Z release version."; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main only, not $GITHUB_REF."; exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

  build:
    name: Build, test, pack and describe the release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: |
          dotnet build "$PROJECT" -c Release -p:ContinuousIntegrationBuild=true
          dotnet build "$TESTS" -c Release
      - name: Test
        shell: bash
        run: |
          set -uo pipefail
          output=$(dotnet test "$TESTS" -c Release --no-build 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          if ! echo "$output" | grep -qE 'Passed:[[:space:]]*[1-9]'; then
            echo "::error::No test passed. An empty test run is not a pass."; exit 1
          fi
          if echo "$output" | grep -qE 'Skipped:[[:space:]]*[1-9]'; then
            echo "::error::Tests were skipped. A run that skips tests is not a pass."; exit 1
          fi
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release
          dotnet pack "$PROJECT" -c Release --no-build -p:ContinuousIntegrationBuild=true -o dist/release
          test -f "dist/release/EchelonFoundry.Summa.Contracts.${VERSION}.nupkg"
          test "$(ls dist/release/*.nupkg | wc -l)" -eq 1
          (cd dist/release && sha256sum *.nupkg > checksums.txt)
          cat dist/release/checksums.txt

      - name: Generate the Echelon release manifest
        uses: kemiller2002/echelon-registry/actions/release-contract@e9b8cf7cbdbf54cc475b63643af9318bbd2fd9e4
        with:
          release-input: release/summa-contracts.release-input.json
          artifact-dir: dist/release
          output: dist/release/echelon-release.json
          version: ${{ needs.version.outputs.version }}
          tag: contracts-v${{ needs.version.outputs.version }}
          commit: ${{ github.sha }}
          release-stage: stable

      - name: Validate the release manifest against the Registry schema
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check jsonschema
          curl -fsSL "https://raw.githubusercontent.com/kemiller2002/echelon-registry/${ECHELON_REGISTRY_REF}/schemas/release-manifest-v2.schema.json" -o "$RUNNER_TEMP/release-manifest-v2.schema.json"
          python3 - "$RUNNER_TEMP/release-manifest-v2.schema.json" dist/release/echelon-release.json <<'PY'
          import json, sys, hashlib, pathlib
          from jsonschema import Draft202012Validator
          schema = json.load(open(sys.argv[1]))
          manifest = json.load(open(sys.argv[2]))
          Draft202012Validator(schema).validate(manifest)
          assert manifest["systemId"] == "summa-contracts", manifest["systemId"]
          for artifact in manifest["artifacts"]:
              digest = hashlib.sha256(pathlib.Path("dist/release", artifact["name"]).read_bytes()).hexdigest()
              assert digest == artifact["sha256"], f"{artifact['name']}: manifest {artifact['sha256']} != file {digest}"
          print(json.dumps(manifest, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: summa-contracts-release-${{ needs.version.outputs.version }}
          path: dist/release
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    needs: [version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: contracts-v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: summa-contracts-release-${{ needs.version.outputs.version }}
          path: dist/release

      - name: Verify the artifacts against their checksums
        working-directory: dist/release
        run: sha256sum -c checksums.txt

      - name: Decide whether this version is already out
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::$TAG is already published. Released versions are immutable; bump <Version> to publish a new build. Nothing was uploaded."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attest build provenance
        if: steps.release.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/release/*.nupkg
            dist/release/checksums.txt
            dist/release/echelon-release.json

      - name: Create the GitHub release
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Summa contracts v${VERSION}" --latest=false \
            --notes "EchelonFoundry.Summa.Contracts ${VERSION} (Chrona-to-Summa billing contract summa.chrona-billing 1.x) built from ${GITHUB_SHA}: the NuGet package, its SHA-256 checksum and the Echelon release manifest (system summa-contracts), each with a GitHub build-provenance (Sigstore) attestation. Install through Conditor's release-asset feed once echelon-registry records this release." \
            dist/release/*.nupkg dist/release/checksums.txt dist/release/echelon-release.json

      - name: Verify the published assets and their attestations
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          check="$(mktemp -d)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$check"
          (cd "$check" && sha256sum -c checksums.txt)
          for asset in "$check"/*.nupkg "$check"/checksums.txt "$check"/echelon-release.json; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/contracts-release.yml" >/dev/null
            echo "attestation verified: $(basename "$asset")"
          done
